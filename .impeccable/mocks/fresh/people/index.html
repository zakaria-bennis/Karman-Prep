<!doctype html>
<html lang="en">

    <meta charset="utf-8" />

    <title>Karman Prep | Free SAT practice test and live classes on Zoom</title>
    <meta
      name="description"
      content="A free SAT practice test on Zoom on Saturday, December 12, then a 20-minute call with a Karman tutor. Live SAT classes, daily practice and a weekly update for parents."
    />
    <link rel="canonical" href="https://karmanprep.com/" />
    <meta
      property="og:title"
      content="Karman Prep | Free SAT practice test and live classes on Zoom"
    />
    <meta
      property="og:description"
      content="A free SAT practice test on Zoom on December 12, then a 20-minute call with a Karman tutor."
    />
    <meta property="og:image" content="img/people-call-tutor.webp" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Theme and opening, decided before first paint so nothing flashes.
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        try {
          var t = localStorage.getItem("karman-people-theme");
          if (t === "light" || t === "dark") d.setAttribute("data-theme", t);
          if (!localStorage.getItem("karman-people-opened")) d.classList.add("intro");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../redesign/engine/engine.css" />
    <link rel="stylesheet" href="people.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Karman Prep",
            "url": "https://karmanprep.com",
            "email": "hello@karmanprep.com"
          },
          {
            "@type": "Course",
            "name": "The March SAT Program",
            "description": "18 live SAT classes on Zoom with a Karman tutor, January 4 to the March 6, 2027 SAT.",
            "provider": { "@type": "Organization", "name": "Karman Prep" },
            "offers": { "@type": "Offer", "price": "995", "priceCurrency": "USD" }
          },
          {
            "@type": "Event",
            "name": "Free practice test",
            "startDate": "2026-12-12T10:00:00-05:00",
            "eventAttendanceMode": "https://schema.org/OnlineEventAttendanceMode",
            "location": {
              "@type": "VirtualLocation",
              "url": "https://karmanprep.com/free-practice-test"
            },
            "organizer": { "@type": "Organization", "name": "Karman Prep" },
            "isAccessibleForFree": true
          }
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip" href="#main" data-c="header.skip"></a>

      <nav class="nav" aria-label="Sections">
        <a href="#classes" data-c="header.nav classes"></a>

        type="button"

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Menu" hidden>
      <div class="sheet-top">
        <span class="sheet-brand" aria-hidden="true"
          ><svg class="mark" viewBox="0 0 40 40">
            <rect class="mark-stem" x="5" y="5" width="9" height="30" />
            <polygon class="mark-arms" points="17.5,20 28.5,5 36,5 25,20 36,35 28.5,35" /></svg
        ></span>

      </div>

        <a href="#classes" data-c="header.nav classes"></a>
        <a href="#try" data-c="header.nav question"></a>
        <a href="#results" data-c="header.nav results"></a>
        <a href="#prices" data-c="header.nav prices"></a>
        <a href="#questions" data-c="header.nav questions"></a>
        <a href="https://karmanprep.com/free-practice-test" data-c="header.nav test"></a>
      </nav>
      <div class="theme-slot theme-slot-sheet"></div>
    </div>

    <main id="main">
      <!-- The split stage (ported idea: 21st.dev "Sticky Content Wrapper", id 26064). The left column
     scrolls; the right panel stays put and shows two people in two places, like the call itself. -->
      <div class="stage">
        <div class="reel">
          <section class="step step-hero" data-shot="0" aria-labelledby="hero-title">
            <div class="hero-copy">
              <h1 id="hero-title" class="rise" data-c="hero.title"></h1>
              <p class="lead rise" data-c="hero.lead"></p>
              <div class="actions rise">
                <a
                  class="button"
                  href="https://karmanprep.com/free-practice-test"
                  data-c="hero.button"
                ></a>
                <a class="text-link" href="#prices" data-c="hero.link"></a>
              </div>
              <p class="facts rise" data-c="hero.facts"></p>
            </div>
            <div class="pair pair-inline pair-call">
              <img
                src="img/people-call-tutor-800.webp"
                srcset="img/people-call-tutor-800.webp 800w, img/people-call-tutor.webp 880w"
                sizes="100vw"
                width="880"
                height="1184"
                alt=""
                data-c-alt="hero.alt tutor"
                class="t-call-tutor"
                fetchpriority="high"
              />
              <img
                src="img/people-call-student-800.webp"
                srcset="img/people-call-student-800.webp 800w, img/people-call-student.webp 880w"
                sizes="100vw"
                width="880"
                height="1184"
                alt=""
                data-c-alt="hero.alt student"
                class="t-call-student"
                fetchpriority="high"
              />
            </div>
          </section>

          <section class="step" id="classes" data-shot="0" aria-labelledby="classes-title">
            <h2 id="classes-title" class="rise" data-c="classes.title"></h2>
            <ul class="points rise">
              <li data-c="classes.point 1"></li>
              <li data-c="classes.point 2"></li>
              <li data-c="classes.point 3"></li>
            </ul>
          </section>

          <section class="step" id="practice" data-shot="1" aria-labelledby="practice-title">
            <div class="pair pair-inline">
              <img
                src="img/people-bus-quiet-800.webp"
                width="880"
                height="1184"
                loading="lazy"
                alt=""
                data-c-alt="practice.alt bus"
                class="t-bus"
              />
              <img
                src="img/people-student-bench-800.webp"
                width="880"
                height="1184"
                loading="lazy"
                alt=""
                data-c-alt="practice.alt bench"
                class="t-bench"
              />
            </div>
            <h2 id="practice-title" class="rise" data-c="practice.title"></h2>
            <p class="lead rise" data-c="practice.point 1"></p>
          </section>

          <section class="step" id="parents" data-shot="2" aria-labelledby="parent-title">
            <div class="pair pair-inline">
              <img
                src="img/people-parent-reading-800.webp"
                width="880"
                height="1184"
                loading="lazy"
                alt=""
                data-c-alt="parent.alt mother"
                class="t-mother"
              />
              <img
                src="img/people-father-sofa-800.webp"
                width="880"
                height="1184"
                loading="lazy"
                alt=""
                data-c-alt="parent.alt father"
                class="t-father"
              />
            </div>
            <h2 id="parent-title" class="rise" data-c="parent.title"></h2>
            <ul class="update-list rise">
              <li data-c="parent.item 1"></li>
              <li data-c="parent.item 2"></li>
              <li data-c="parent.item 3"></li>
              <li data-c="parent.item 4"></li>
            </ul>
            <p class="points-after rise" data-c="parent.private"></p>
          </section>
        </div>

        <div class="panel" aria-hidden="true">
          <div class="scene is-on" data-shot="0">
            <img
              src="img/people-call-tutor.webp"
              width="880"
              height="1184"
              alt=""
              class="t-call-tutor"
            />
            <img
              src="img/people-call-student.webp"
              width="880"
              height="1184"
              alt=""
              class="t-call-student"
            />
          </div>
          <div class="scene" data-shot="1">
            <img
              src="img/people-bus-quiet.webp"
              width="880"
              height="1184"
              alt=""
              loading="lazy"
              class="t-bus"
            />
            <img
              src="img/people-student-bench.webp"
              width="880"
              height="1184"
              alt=""
              loading="lazy"
              class="t-bench"
            />
          </div>
          <div class="scene" data-shot="2">
            <img
              src="img/people-parent-reading.webp"
              width="880"
              height="1184"
              alt=""
              loading="lazy"
              class="t-mother"
            />
            <img
              src="img/people-father-sofa.webp"
              width="880"
              height="1184"
              alt=""
              loading="lazy"
              class="t-father"
            />
          </div>
        </div>
      </div>

      <!-- The real Karman quiz engine: a live fragment from redesign/engine/, graded with the engine's own classes. -->
      <section class="demo" id="try" aria-labelledby="try-title">
        <div class="demo-side">
          <h2 id="try-title" class="rise" data-c="demo.title"></h2>
          <p class="lead rise" data-c="demo.lead"></p>
          <div class="demo-list rise" role="group" data-c-label="demo.list label">
            <button
              type="button"
              class="demo-pick"
              data-q="alg-1"
              data-answer="C"
              data-explain="demo.explain q1"
              aria-pressed="true"
              data-c="demo.q1"
            ></button>
            <button
              type="button"
              class="demo-pick"
              data-q="adv-3"
              data-answer="C"
              data-explain="demo.explain q2"
              aria-pressed="false"
              data-c="demo.q2"
            ></button>
            <button
              type="button"
              class="demo-pick"
              data-q="conv-2"
              data-answer="C"
              data-explain="demo.explain q3"
              aria-pressed="false"
              data-c="demo.q3"
            ></button>
          </div>
        </div>
        <div class="demo-stage rise">
          <div class="engine-box" data-ui role="region" data-c-label="demo.stage label">
            <div class="engine-skeleton" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div class="demo-result" aria-live="polite">
            <p class="demo-verdict"></p>
            <p class="demo-explain"></p>
            <p class="demo-after"></p>
            <button type="button" class="text-link demo-again" hidden data-c="demo.again"></button>
          </div>
        </div>
      </section>

      <section class="results" id="results" aria-labelledby="results-title">
        <div class="results-pic rise">
          <img
            src="img/result-mateo.webp"
            width="576"
            height="960"
            loading="lazy"
            alt=""
            data-c-alt="results.r1 alt"
            class="is-on"
            data-r="0"
          />
          <img
            src="img/result-priya.webp"
            width="576"
            height="960"
            loading="lazy"
            alt=""
            data-c-alt="results.r2 alt"
            data-r="1"
          />
          <img
            src="img/result-ava.webp"
            width="576"
            height="960"
            loading="lazy"
            alt=""
            data-c-alt="results.r3 alt"
            data-r="2"
          />
        </div>
        <div class="results-copy">
          <h2 id="results-title" class="rise" data-c="results.title"></h2>
          <p class="source rise" data-c="results.source"></p>
          <ul class="scores rise">
            <li>
              <button type="button" class="score is-on" data-r="0" aria-pressed="true">
                <span class="score-n" data-c="results.r1 score"></span
                ><span class="score-who"
                  ><span data-c="results.r1 name"></span><span data-c="results.r1 college"></span
                ></span>
              </button>
            </li>
            <li>
              <button type="button" class="score" data-r="1" aria-pressed="false">
                <span class="score-n" data-c="results.r2 score"></span
                ><span class="score-who"
                  ><span data-c="results.r2 name"></span><span data-c="results.r2 college"></span
                ></span>
              </button>
            </li>
            <li>
              <button type="button" class="score" data-r="2" aria-pressed="false">
                <span class="score-n" data-c="results.r3 score"></span
                ><span class="score-who"
                  ><span data-c="results.r3 name"></span><span data-c="results.r3 college"></span
                ></span>
              </button>
            </li>
          </ul>
        </div>
      </section>

      <section class="prices" id="prices" aria-labelledby="prices-title">
        <div class="prices-head">
          <h2 id="prices-title" class="rise" data-c="prices.title"></h2>
        </div>
        <div class="menu-cols">
          <div class="menu-col rise">
            <h3 data-c="prices.live group"></h3>
            <dl class="menu">
              <div>
                <dt data-c="prices.march name"></dt>
                <dd class="price" data-c="prices.march price"></dd>

              </div>
              <div>
                <dt data-c="prices.private10 name"></dt>
                <dd class="price" data-c="prices.private10 price"></dd>

              </div>
              <div>
                <dt data-c="prices.private20 name"></dt>
                <dd class="price" data-c="prices.private20 price"></dd>
                <dd class="note" data-c="prices.private20 note"></dd>
              </div>
            </dl>
            <p class="guarantee">
              <span data-c="prices.guarantee"></span>
              <a
                class="text-link"
                href="https://karmanprep.com/guarantee"
                data-c="prices.guarantee link"
              ></a>
            </p>
          </div>
          <div class="menu-col rise">
            <h3 data-c="prices.practice group"></h3>
            <dl class="menu">
              <div>
                <dt data-c="prices.free name"></dt>
                <dd class="price" data-c="prices.free price"></dd>
                <dd class="note" data-c="prices.free note"></dd>
              </div>
              <div>
                <dt data-c="prices.platform name"></dt>
                <dd class="price" data-c="prices.platform price"></dd>
                <dd class="note" data-c="prices.platform note"></dd>
              </div>
              <div>
                <dt data-c="prices.plus name"></dt>
                <dd class="price" data-c="prices.plus price"></dd>
                <dd class="note" data-c="prices.plus note"></dd>
              </div>
            </dl>
            <h3 data-c="prices.school group"></h3>
            <dl class="menu">
              <div>
                <dt data-c="prices.school name"></dt>
                <dd class="price" data-c="prices.school price"></dd>
                <dd class="note" data-c="prices.school note"></dd>
              </div>
            </dl>
          </div>
        </div>
      </section>

      <section class="faq" id="questions" aria-labelledby="faq-title">
        <div class="faq-copy">
          <h2 id="faq-title" class="rise" data-c="faq.title"></h2>
          <div class="test-facts rise">
            <h3 data-c="faq.test title"></h3>
            <ul>
              <li data-c="faq.fact 1"></li>
              <li data-c="faq.fact 2"></li>
              <li data-c="faq.fact 3"></li>
              <li data-c="faq.fact 4"></li>
            </ul>
          </div>

            <h3>
              <button
                type="button"
                class="acc-q"
                aria-expanded="false"
                id="aq1"
                aria-controls="aa1"
              >
                <span data-c="faq.q1"></span
                ><svg class="chev" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M3.5 6 8 10.5 12.5 6" />
                </svg>
              </button>
            </h3>
            <div class="acc-a" id="aa1" role="region" aria-labelledby="aq1">
              <div><p data-c="faq.a1"></p></div>
            </div>
            <h3>
              <button
                type="button"
                class="acc-q"
                aria-expanded="false"
                id="aq2"
                aria-controls="aa2"
              >
                <span data-c="faq.q2"></span
                ><svg class="chev" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M3.5 6 8 10.5 12.5 6" />
                </svg>
              </button>
            </h3>
            <div class="acc-a" id="aa2" role="region" aria-labelledby="aq2">

                </svg>

            </h3>
            <div class="acc-a" id="aa3" role="region" aria-labelledby="aq3">

            <h3>

                aria-expanded="false"

            </h3>

                <span data-c="faq.q6"></span

              </button>
            </h3>
            <div class="acc-a" id="aa6" role="region" aria-labelledby="aq6">
              <div><p data-c="faq.a6"></p></div>
            </div>
          </div>
          <a
            class="text-link rise"
            href="mailto:hello@karmanprep.com?subject=A%20question%20about%20Karman"
            data-c="faq.email link"
          ></a>
        </div>
        <div class="faq-pics rise">
          <img
