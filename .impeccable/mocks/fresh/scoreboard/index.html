<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Karman Prep: free SAT practice test, live classes and 1:1 tutoring</title>
    <meta
      name="description"
      content="Start with Karman's free SAT practice test on Saturday, December 12: a predicted score, a breakdown by domain and a 20-minute call with a Karman tutor."
    />
    <link rel="canonical" href="https://karmanprep.com/" />
    <meta property="og:title" content="Karman Prep: the SAT score before you pay" />
    <meta
      property="og:description"
      content="A free SAT practice test, live on Zoom on Saturday, December 12."
    />
    <meta property="og:image" content="https://karmanprep.com/og.png" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Theme before first paint: the saved choice wins, else the device, else dark (rule 33).
      (function () {
        var d = document.documentElement,
          t = null;
        try {
          t = localStorage.getItem("karman-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        d.setAttribute("data-scheme", t);
        d.classList.add("js");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../redesign/engine/engine.css" />
    <link rel="stylesheet" href="scoreboard.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Karman Prep",
            "url": "https://karmanprep.com",
            "email": "hello@karmanprep.com"
          },
          {
            "@type": "Event",
            "name": "Free SAT practice test",
            "startDate": "2026-12-12T10:00:00-05:00",
            "eventAttendanceMode": "https://schema.org/OnlineEventAttendanceMode",
            "location": {
              "@type": "VirtualLocation",
              "url": "https://karmanprep.com/free-practice-test"
            },
            "isAccessibleForFree": true,
            "organizer": {
              "@type": "Organization",
              "name": "Karman Prep",
              "url": "https://karmanprep.com"
            }
          },
          {
            "@type": "Course",
            "name": "The March SAT Program",
            "description": "Nine weeks of live SAT classes on Zoom, ending on the March 6, 2027 SAT.",
            "provider": { "@type": "Organization", "name": "Karman Prep" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip" href="#main" data-c="site.skip"></a>

    <!-- Opening: forms the mark and wordmark, then lands them in the header. First visit only. -->
    <div class="opening" id="opening" aria-hidden="true" hidden>
      <div class="opening-lockup" id="openingLockup"></div>
      <button class="opening-skip" type="button" data-c="site.skip opening"></button>
    </div>

    <header class="bar" id="top">
      <a class="logo" href="#top" data-c-label="site.home label" id="headerLogo"></a>
      <nav class="nav" aria-label="Sections" id="nav"></nav>
      <div class="bar-end">
        <button class="mode" type="button" id="modeBtn" aria-pressed="false"></button>
        <button
          class="menu-btn"
          type="button"
          id="menuBtn"
          aria-expanded="false"
          aria-controls="sheet"
          data-c="site.menu"
        ></button>
      </div>
    </header>

    <div
      class="sheet"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheetTitle"
      hidden
    >
      <div class="sheet-top">
        <span class="logo" id="sheetTitle"></span>
        <button class="menu-btn" type="button" id="sheetClose" data-c="site.close"></button>
      </div>
      <nav class="sheet-nav" aria-label="Sections" id="sheetNav"></nav>
    </div>

    <main id="main">
      <!-- HERO: the title, the offer and the one button on the reading column; the real practice
       screen, live and self-grading, on the other side -->
      <section class="hero" aria-labelledby="heroTitle">
        <div class="wrap hero-grid">
          <div class="hero-text">
            <h1 class="hero-title" id="heroTitle">
              <span class="line"><span data-c="hero.title line 1"></span></span>
              <span class="line"><span data-c="hero.title line 2"></span></span>
            </h1>
            <p class="lead" data-c="hero.text"></p>
            <a
              class="btn"
              href="https://karmanprep.com/free-practice-test"
              data-c="hero.button"
              data-cta
            ></a>
            <dl class="facts" id="heroFacts"></dl>
          </div>
          <div class="hero-demo" id="practice">
            <h2 class="demo-title" data-c="practice.title"></h2>
            <div class="live" id="live" data-ui aria-live="polite">
              <div class="skeleton" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
              <p class="sr-only" data-c="practice.loading"></p>
            </div>
            <div class="verdict" id="verdict" role="status">
              <p id="verdictText"></p>
              <button
                class="textlink"
                type="button"
                id="again"
                hidden
                data-c="practice.again"
              ></button>
            </div>
          </div>
        </div>
      </section>

      <!-- DAILY 10: the review schedule as a day axis -->
      <section class="sec daily" id="daily" aria-labelledby="dailyTitle">
        <div class="wrap split">
          <div class="split-text" data-reveal>
            <h2 class="h2" id="dailyTitle" data-c="daily.title"></h2>
            <p class="body" data-c="daily.text"></p>
            <div class="axis-wrap" data-ui>
              <ol class="axis" id="axis"></ol>
              <p class="axis-unit" data-c="daily.axis unit"></p>
            </div>
            <p class="note" data-c="daily.note"></p>
          </div>
          <figure class="split-media split-photo" data-reveal>
            <img
              src="img/bus-phone.webp"
              srcset="img/bus-phone-800.webp 600w, img/bus-phone.webp 768w"
              sizes="(min-width: 900px) 40vw, 100vw"
              width="768"
              height="1360"
              loading="lazy"
              data-c-alt="daily.photo alt"
            />
          </figure>
        </div>
      </section>

      <!-- RESULTS: a marigold field, the three official scores as the page's largest type -->
      <section class="field results" id="results" aria-labelledby="resultsTitle">
        <div class="wrap">
          <h2 class="h2" id="resultsTitle" data-c="results.title" data-reveal></h2>
          <ul class="scores" id="scores"></ul>
          <p class="source" data-c="results.source" data-reveal></p>
        </div>
      </section>

      <!-- PROGRAM: the March cohort, tutor and student each in their own place -->
      <section class="sec program" id="program" aria-labelledby="programTitle">
        <div class="wrap split" data-reveal>
          <div class="split-text">
            <h2 class="h2" id="programTitle" data-c="program.title"></h2>
            <p class="body" data-c="program.text"></p>
          </div>
        </div>
        <div class="pair" data-reveal>
          <figure>
            <img
              src="img/tutor-zoom.webp"
              srcset="img/tutor-zoom-800.webp 800w, img/tutor-zoom.webp 880w"
              sizes="50vw"
              width="880"
              height="1184"
              loading="lazy"
              data-c-alt="program.tutor alt"
            />
          </figure>
          <figure>
            <img
              src="img/girl-window.webp"
              srcset="img/girl-window-800.webp 800w, img/girl-window.webp 1024w"
              sizes="50vw"
              width="1024"
              height="1024"
              loading="lazy"
              data-c-alt="program.student alt"
            />
          </figure>
        </div>
        <div class="wrap">
          <dl class="tally" id="programFacts"></dl>
          <p class="prog-link" data-reveal>
            <a class="textlink" href="https://karmanprep.com/program" data-c="program.link"></a>
          </p>
        </div>
      </section>

      <!-- GUARANTEE: the terms as a table -->
      <section class="field inverse guarantee" id="guarantee" aria-labelledby="guaranteeTitle">
        <div class="wrap split-g">
          <div data-reveal>
            <h2 class="h2 big" id="guaranteeTitle" data-c="guarantee.title"></h2>
            <p class="body" data-c="guarantee.text"></p>
            <p class="body" data-c="guarantee.asks"></p>
            <p class="body" data-c="guarantee.private"></p>
            <p>
              <a
                class="textlink"
                href="https://karmanprep.com/guarantee"
                data-c="guarantee.link"
              ></a>
            </p>
          </div>
          <div data-reveal>
            <table class="terms" id="terms"></table>
          </div>
        </div>
      </section>

      <!-- UPDATES: what the parent receives -->
      <section class="sec updates" id="updates" aria-labelledby="updatesTitle">
        <div class="wrap split">
          <div class="split-text" data-reveal>
            <h2 class="h2" id="updatesTitle" data-c="updates.title"></h2>
            <p class="lead" data-c="updates.text"></p>
          </div>
          <figure class="split-media split-photo" data-reveal>
            <img
              src="img/parent-phone.webp"
              srcset="img/parent-phone-800.webp 800w, img/parent-phone.webp 880w"
              sizes="(min-width: 900px) 50vw, 100vw"
              width="880"
              height="1184"
              loading="lazy"
              data-c-alt="updates.photo alt"
            />
          </figure>
        </div>
      </section>

      <!-- PLANS: every plan as one large table -->
      <section class="sec plans" id="plans" aria-labelledby="plansTitle">
        <div class="wrap">
          <h2 class="h2" id="plansTitle" data-c="plans.title" data-reveal></h2>
          <table class="ladder" id="ladder" data-reveal></table>
          <p class="note" data-c="plans.note"></p>
          <p><a class="textlink" href="https://karmanprep.com/pricing" data-c="plans.link"></a></p>
        </div>
      </section>

      <!-- FAQ: answers as reading text -->
      <section class="sec faq" id="faq" aria-labelledby="faqTitle">
        <div class="wrap faq-grid">
          <h2 class="h2" id="faqTitle" data-c="faq.title" data-reveal></h2>
          <div class="faq-text" id="faqText" data-reveal></div>
        </div>
      </section>

      <!-- CLOSE: the date, the objection, the one button -->
      <section class="field quiet close" id="test" aria-labelledby="closeTitle">
        <div class="wrap close-grid">
          <div class="close-text" data-reveal>
            <h2 class="h2 date" id="closeTitle" data-c="close.title"></h2>
            <p class="count" id="count" hidden>
              <span class="digits" id="countDigits"></span> <span data-c="close.count"></span>
            </p>
            <p class="lead" data-c="close.text"></p>
            <a
              class="btn"
              href="https://karmanprep.com/free-practice-test"
              data-c="close.button"
              data-cta
            ></a>
          </div>
          <figure class="close-photo" data-reveal>
            <img
              src="img/weekend-desk.webp"
              srcset="img/weekend-desk-800.webp 800w, img/weekend-desk.webp 880w"
              sizes="(min-width: 900px) 40vw, 100vw"
              width="880"
              height="1184"
              loading="lazy"
              data-c-alt="close.photo alt"
            />
          </figure>
        </div>
      </section>
    </main>

    <!-- The button that follows the reader: shown only while no other button is on screen (rule 35). -->
    <div class="dock" id="dock" hidden>
      <p class="dock-text" data-c="site.dock text"></p>
      <a
        class="btn"
        href="https://karmanprep.com/free-practice-test"
        data-c="site.dock button"
        data-dock
      ></a>
    </div>

    <footer class="foot">
      <div class="wrap">
        <a class="foot-mark" href="#top" id="footMark" data-c-label="footer.top"></a>
        <div class="foot-row">
          <a class="foot-mail" id="footMail"></a>
          <ul class="foot-links" id="footLinks"></ul>
          <div class="switch" id="themeSwitch" role="radiogroup"></div>
        </div>
        <div class="foot-last">
          <p data-c="footer.copyright"></p>
          <a class="textlink" href="#top" data-c="footer.top"></a>
        </div>
      </div>
    </footer>

    <script src="copy.js"></script>
    <script src="scoreboard.js"></script>
  </body>
</html>
