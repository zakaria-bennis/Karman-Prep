    <script>
      // Theme before first paint: a remembered choice, else the device, else dark (rule 33).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("karman-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.classList.add("js");
        // First visit: cover the page with the opening from the very first paint.
        try {
          if (!localStorage.getItem("karman-intro-seen"))
            document.documentElement.classList.add("first-visit");
        } catch (e) {}
      })();
    </script>
