<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karman options</title>
<meta name="description" content="The three site directions, the four logo marks and the portals, side by side, for the founder to pick.">
<link rel="icon" href="logo/favicon-ascent.svg" type="image/svg+xml">
<script>
  // Rule 33: the device's mode, dark when it states none.
  (function () {
    var t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f5f5f2;--card:#ebeae5;--ink:#12110f;--ink2:#57534b;--line:rgba(18,17,15,.14);--marigold:#eba21f;--on-mari:#0b0b0b}
  html[data-theme="dark"]{--paper:#151412;--card:#201e1b;--ink:#f1ede4;--ink2:#b6b0a4;--line:rgba(241,237,228,.16)}
  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 "Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
  .wrap{width:min(1180px,100% - 32px);margin:0 auto;padding:48px 0 80px}
  h1{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0 0 12px}
  h2{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.02em;margin:56px 0 16px}
  h3{font-size:22px;font-weight:800;margin:0 0 6px}
  p{margin:0 0 10px;max-width:68ch}
  .muted{color:var(--ink2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .card{background:var(--card);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent}
  .card.pick{border-color:var(--marigold)}
  .tag{align-self:flex-start;background:var(--marigold);color:var(--on-mari);font-weight:800;font-size:14px;padding:4px 10px;border-radius:999px}
  .score{font-size:15px;color:var(--ink2)}
  .score b{color:var(--ink);font-size:20px}
  .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:10px}
  a.lk{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
  a.lk:hover{background:var(--ink);color:var(--paper)}
  ul{margin:0;padding-left:20px}
  li{margin:2px 0}
  :focus-visible{outline:3px solid var(--marigold);outline-offset:3px;border-radius:10px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
  // Everything this page says lives in this one object.
  const DATA = {
    title: "Pick a direction and a mark.",
    lede: "Three complete website directions, four logo marks, and the signed-in portals. Open each one, then tell me two things: which direction, and which mark. If you say nothing, I go with my pick.",
    directions: [
      { id: "c-bluebook-honest", name: "C. Bluebook, honest", pick: true, score: "", idea: "The test's own screen is the world. A real SAT question is the first thing you see, and you can tap an answer.", good: [], weak: [] },
      { id: "b-apple-product", name: "B. Product page", pick: false, score: "", idea: "Like a phone maker's product page: one feature per full screen, then a plain spec table.", good: [], weak: [] },
      { id: "a-ascent", name: "A. Ascent", pick: false, score: "", idea: "The calmest one. Big words, lots of space, the line where space begins as the theme.", good: [], weak: [] },
    ],
    marksTitle: "The logo",
    marksText: "Four marks, each drawn in code, each with its own opening: the mark forms, then flies into the header. My pick is Ascent: one stroke climbs and levels off, a score going up to the line where space begins, which is what Karman means.",
    portalsTitle: "The portals",
    portalsText: "Student, parent, tutor and school portals, plus the Daily 10 end screen. Every screen in light and dark, on phone, iPad and desktop. The data is made up for the demo.",
    oldTitle: "The old version",
    oldText: "The page you turned down, kept only so you can compare.",
  };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const list = (xs) => (xs.length ? `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "");
  const portals = `http://${location.hostname}:5174/`;

  document.getElementById("app").innerHTML = `
    <h1>${esc(DATA.title)}</h1>
    <p class="muted">${esc(DATA.lede)}</p>
    <h2>The website</h2>
    <div class="grid">
      ${DATA.directions.map((d) => `
        <article class="card${d.pick ? " pick" : ""}">
          ${d.pick ? `<span class="tag">My pick</span>` : ""}
          <h3>${esc(d.name)}</h3>
          ${d.score ? `<div class="score">Judges' score <b>${esc(d.score)}</b> of 10</div>` : ""}
          <p>${esc(d.idea)}</p>
          ${d.good.length ? `<p><strong>Works</strong></p>${list(d.good)}` : ""}
          ${d.weak.length ? `<p><strong>Weak</strong></p>${list(d.weak)}` : ""}
          <div class="links">
            <a class="lk" href="${d.id}/index.html">Home</a>
            <a class="lk" href="${d.id}/pricing.html">Pricing</a>
          </div>
        </article>`).join("")}
    </div>
    <h2>${esc(DATA.marksTitle)}</h2>
    <p>${esc(DATA.marksText)}</p>
    <div class="links"><a class="lk" href="logo/index.html">Open the four marks</a></div>
    <h2>${esc(DATA.portalsTitle)}</h2>
    <p>${esc(DATA.portalsText)}</p>
    <div class="links"><a class="lk" href="${portals}">Open the portals</a></div>
    <h2>${esc(DATA.oldTitle)}</h2>
    <p class="muted">${esc(DATA.oldText)}</p>
    <div class="links"><a class="lk" href="../decision/film/index.html">Old home</a></div>
  `;
</script>
</body>
</html>
