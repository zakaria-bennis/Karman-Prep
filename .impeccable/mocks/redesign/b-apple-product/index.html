<!doctype html>
<html lang="en" id="top">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karman SAT prep: a real question, the whole guarantee, one free test</title>
<meta name="description" content="SAT prep for your student: Your Daily 10, Karman tutors in every live class, full-length tests with a predicted score and a weekly update to you. Try a real Karman question, then take the free practice test on December 12.">
<link rel="canonical" href="https://karmanprep.com/">
<meta property="og:title" content="Karman SAT prep: a real question, the whole guarantee, one free test">
<meta property="og:description" content="Try a real Karman question, read the whole guarantee, and take the free practice test on Saturday, December 12.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://karmanprep.com/">
<meta property="og:image" content="https://karmanprep.com/site/film/day.jpg">
<link rel="icon" href="../logo/favicon-ascent.svg" type="image/svg+xml">
<script>
  // Rule 33: the device's mode, dark when it states none, the toggle remembered.
  (function () {
    var t = null;
    try { t = localStorage.getItem("karman-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    var seen = false;
    try { seen = sessionStorage.getItem("karman-intro") === "1"; } catch (e) {}
    if (!seen && !/[?&]intro=0/.test(location.search)) document.documentElement.setAttribute("data-intro", "");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine/engine.css">
<link rel="stylesheet" href="site.css">
<link rel="preload" as="image" href="../../decision/film/day.jpg" media="not ((max-width: 760px) and (orientation: portrait))">
<link rel="preload" as="image" href="../../decision/film/day-p.jpg" media="(max-width: 760px) and (orientation: portrait)">
</head>
<body>
<script src="copy.js"></script>

<div class="stage" aria-hidden="true">
  <video class="day" muted playsinline loop preload="none"></video>
  <video class="edge" muted playsinline preload="none"></video>
</div>

<div data-page="site">
  <main id="main">
    <section class="field ground hero" id="hero" aria-labelledby="h-hero">
      <div class="in">
        <div class="claim" data-rise>
          <h1 id="h-hero" data-c="Hero.headline"></h1>
          <p class="lede" data-c="Hero.text"></p>
        </div>
        <div class="act" data-rise>
          <a class="btn" id="hero-btn" href="#"></a>
          <span class="note" data-c="Hero.button note"></span>
        </div>
      </div>
    </section>
    <section class="window hero-stage" id="q" aria-label="A Karman question">
      <div class="engine-box" id="engine-host"></div>
      <div class="engine-note" id="engine-note"></div>
    </section>

    <section class="field b daily" id="daily" aria-labelledby="h-daily">
      <div class="in">
        <div class="claim" data-rise>
          <h2 id="h-daily" data-c="Daily 10.headline"></h2>
          <p class="lede" data-c="Daily 10.text"></p>
        </div>
        <div class="picture" data-rise>
          <div class="beside">
            <p class="lead" data-c="Daily 10.lead"></p>
            <p class="ret num"><b>2</b> days</p><p class="ret num"><b>7</b> days</p><p class="ret num"><b>21</b> days</p>
          </div>
          <div class="phone">
            <img data-light="../engine/renders/alg-1-phone-light-wrong.webp" data-dark="../engine/renders/alg-1-phone-dark-wrong.webp" data-size="880x1912" src="../engine/renders/alg-1-phone-dark-wrong.webp" width="880" height="1912" loading="lazy" data-alt="Daily 10.alt" alt="">
          </div>
        </div>
      </div>
    </section>

    <section class="field a tutors" id="tutors" aria-labelledby="h-tutors">
      <div class="in split" data-rise>
        <figure class="photo"><img src="../../decision/film/photos/p-private.webp" width="1200" height="1500" loading="lazy" data-alt="Tutors.alt" alt=""></figure>
        <div class="words">
          <h2 id="h-tutors" data-c="Tutors.headline"></h2>
          <p class="lede" data-c="Tutors.text"></p>
          <div class="card"><h3 data-c="Tutors.card title"></h3><p data-c="Tutors.card text"></p></div>
        </div>
      </div>
    </section>

    <section class="field b tests" id="tests" aria-labelledby="h-tests">
      <div class="in">
        <div class="claim" data-rise>
          <h2 id="h-tests" data-c="Tests.headline"></h2>
          <p class="lede" data-c="Tests.text"></p>
        </div>
        <div class="picture" data-rise>
          <div class="shot"><img data-light="../engine/renders/adv-3-desktop-light-question.webp" data-dark="../engine/renders/adv-3-desktop-dark-question.webp" data-size="2400x1600" data-light-phone="../engine/renders/adv-3-phone-light-question.webp" data-dark-phone="../engine/renders/adv-3-phone-dark-question.webp" data-size-phone="880x1912" src="../engine/renders/adv-3-desktop-dark-question.webp" width="2400" height="1600" loading="lazy" data-alt="Tests.alt" alt=""></div>
        </div>
      </div>
    </section>

    <section class="field a parents" id="parents" aria-labelledby="h-parents">
      <div class="in split mirror" data-rise>
        <div class="words">
          <h2 id="h-parents" data-c="Parents.headline"></h2>
          <p class="lede" data-c="Parents.text"></p>
        </div>
        <figure class="photo"><img src="../../decision/film/photos/p-guarantee.webp" width="1200" height="1500" loading="lazy" data-alt="Parents.alt" alt=""></figure>
      </div>
    </section>

    <section class="field b results" id="results" aria-labelledby="h-results">
      <div class="in">
        <div data-rise><h2 id="h-results" data-c="Results.headline"></h2></div>
        <div class="pair" data-rise>
          <div class="spec before"><span class="big num">1235</span><span class="cap" data-c="Results.before"></span></div>
          <div class="spec after"><span class="big num">1520</span><span class="cap" data-c="Results.after"></span></div>
        </div>
        <div class="text" data-rise>
          <p class="lede" data-c="Results.text"></p>
          <p class="muted" data-c="Results.line"></p>
        </div>
      </div>
    </section>

    <section class="field a guar" id="guarantee" aria-labelledby="h-guar">
      <div class="in">
        <div class="claim" data-rise>
          <h2 id="h-guar" data-c="Guarantee.headline"></h2>
          <p class="lede" data-c="Guarantee.text"></p>
        </div>
        <div class="promise" data-rise>
          <p class="big" data-c="Guarantee.promise"></p>
          <p class="note muted" data-c="Guarantee.promise note"></p>
        </div>
        <ul class="outcomes" id="outcomes" data-rise></ul>
        <div class="rules" data-rise>
          <div><h3 data-c="Guarantee.we do title"></h3><ul id="we-do"></ul></div>
          <div><h3 data-c="Guarantee.you do title"></h3><ul id="you-do"></ul></div>
        </div>
        <div class="covers" data-rise>
          <p data-c="Guarantee.covers"></p>
          <a class="lk" id="guar-link" href="#"></a>
        </div>
      </div>
    </section>

    <section class="field b campus" id="campus" aria-labelledby="h-campus">
      <div class="in">
        <div class="claim" data-rise><h2 id="h-campus" data-c="Campus.headline"></h2><p class="lede line" data-c="Campus.line"></p></div>
        <div class="trio" id="trio" data-rise></div>
      </div>
    </section>

    <section class="window close" id="close" aria-labelledby="h-close">
      <div class="in">
        <div class="panel" data-rise>
          <h2 id="h-close" data-c="Close.headline"></h2>
          <p class="lede" data-c="Close.text"></p>
          <div class="act"><a class="btn" id="close-btn" href="#"></a><span class="note" data-c="Close.button note"></span></div>
          <p class="honest muted" data-c="Close.honest note"></p>
        </div>
      </div>
    </section>
  </main>
  <footer class="field b ft"></footer>
</div>

<script type="module">
  import { S, esc, list, pairs, ROUTES, FILM, ICON, chrome, stage, campus, reveal, liveQuestion, themedPictures } from "./site.js";

  // words from copy.js: data-c="Section.label"
  document.querySelectorAll("[data-c]").forEach((el) => {
    const [sec, ...rest] = el.dataset.c.split(".");
    el.textContent = S(sec)[rest.join(".")] || "";
  });
  document.querySelectorAll("[data-alt]").forEach((img) => {
    const [sec, ...rest] = img.dataset.alt.split(".");
    img.alt = S(sec)[rest.join(".")] || "";
  });
  const hero = S("Hero"), close = S("Close"), g = S("Guarantee"), camp = S("Campus");
  const heroBtn = document.getElementById("hero-btn");
  heroBtn.textContent = hero.button; heroBtn.href = ROUTES.test;
  const closeBtn = document.getElementById("close-btn");
  closeBtn.textContent = close.button; closeBtn.href = ROUTES.test;
  const gl = document.getElementById("guar-link");
  gl.innerHTML = `${esc(g.link)}${ICON.arrow}`;
  gl.href = ROUTES.guarantee;

  document.getElementById("outcomes").innerHTML = pairs(g.outcomes).map(([a, b]) => `<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join("");
  document.getElementById("we-do").innerHTML = list(g["we do"]).map((x) => `<li>${esc(x)}</li>`).join("");
  document.getElementById("you-do").innerHTML = list(g["you do"]).map((x) => `<li>${esc(x)}</li>`).join("");

  // the campus trio (design rule 47): each clip is found by the student's name, never by its place in the
  // list. Clip ids from assets/manifest.json: c8a Mateo (Harvard), c8b Priya (Stanford), c8c Ava (UC Berkeley).
  // The still is the frame with the student and the lettering in it (c8?-r.jpg), so the caption matches it.
  const CLIP = { ava: "c8c", mateo: "c8a", priya: "c8b" };
  document.getElementById("trio").innerHTML = pairs(camp.captions).map(([name, cap]) => {
    const id = CLIP[name.toLowerCase()];
    if (!id) return "";
    return `<figure class="clip"><div class="fr"><video muted playsinline preload="none" data-src="${FILM}${id}-r.mp4" poster="${FILM}${id}-r.jpg" aria-label="${esc(name)}, ${esc(cap)}"></video></div><figcaption><span>${esc(name)}</span><span>${esc(cap)}</span></figcaption></figure>`;
  }).join("");

  chrome({ page: "home" });
  themedPictures();
  reveal();
  stage();
  campus();
  liveQuestion(document.getElementById("engine-host"), document.getElementById("engine-note"));
</script>
</body>
</html>
