<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karman marks</title>
<meta name="description" content="Four logo options for Karman with their opening animations, at every size, in light and dark.">
<link rel="icon" href="favicon-ascent.svg" type="image/svg+xml">
<script>
  // Rule 33: the device's mode, dark when it states none, the toggle remembered.
  (function () {
    var t = null;
    try { t = localStorage.getItem("karman-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    var seen = false;
    try { seen = sessionStorage.getItem("karman-intro") === "1"; } catch (e) {}
    if (!seen) document.documentElement.setAttribute("data-intro", "");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f5f2; --ink:#12110f; --ink2:#57534b; --line:rgba(18,17,15,.14);
    --night:#0e0d0c; --bone:#f1ede4; --marigold:#eba21f; --marigold-ink:#94600a; --on-mari:#0b0b0b;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  html[data-theme="dark"]{
    --paper:#151412; --ink:#f1ede4; --ink2:#b6b0a4; --line:rgba(241,237,228,.16); --marigold-ink:#f0b545;
  }
  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 "Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
  /* While the opening plays, the page sits under the overlay at opacity 0 and fades in beneath the flight.
     If the script never runs, this CSS brings the page back on its own. */
  html[data-intro] [data-page="site"]{opacity:0;animation:k-restore 0s linear 1.6s forwards}
  @keyframes k-restore{to{opacity:1}}
  a{color:inherit}
  h1,h2,h3{font-weight:800;letter-spacing:-0.03em;line-height:1.05;margin:0}
  h1{font-size:clamp(34px,5.6vw,58px)}
  h2{font-size:clamp(26px,3.4vw,36px)}
  h3{font-size:15px;font-weight:700;letter-spacing:0;color:var(--ink2);text-transform:none;margin:0 0 10px}
  p{margin:0}
  .wrap{width:min(1180px,100% - 32px);margin:0 auto}
  .hd{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
  .hd .wrap{display:flex;align-items:center;gap:18px;min-height:64px}
  .hd .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .btn:active{transform:scale(.97)}
  .btn.mari{background:var(--marigold);border-color:var(--marigold);color:var(--on-mari);font-weight:800;min-height:52px;padding:0 24px;font-size:16px}
  :focus-visible{outline:3px solid var(--marigold);outline-offset:3px;border-radius:10px}

  /* 21st.dev component 37311 (bysages/switch), ported to plain HTML and recoloured with Karman's tokens:
     a track that rests in the inset shade of the paper and fills flat with ink when on, the thumb sliding on a spring. */
  .sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;font-weight:600;font-size:15px}
  .sw-control{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background .2s var(--ease);flex:none;border:0;padding:0;cursor:pointer}
  .sw-thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);transition:transform .35s cubic-bezier(.3,1.4,.4,1)}
  .sw-control[aria-checked="true"]{background:var(--ink)}
  .sw-control[aria-checked="true"] .sw-thumb{transform:translateX(18px)}

  .lede{padding:56px 0 28px;display:grid;gap:18px;max-width:760px}
  .lede p{font-size:19px;color:var(--ink2)}
  .lede .pick{color:var(--ink);font-weight:500;border-top:1px solid var(--line);padding-top:16px}
  .lede .pick b{color:var(--marigold-ink)}

  .opt{padding:36px 0 44px;border-top:1px solid var(--line);display:grid;gap:22px}
  .opt header{display:grid;gap:8px;max-width:760px}
  .opt .rank{font-size:14px;color:var(--ink2);font-weight:600}
  .opt header p{color:var(--ink2);font-size:17px}
  .grounds{display:grid;gap:14px;grid-template-columns:1fr}
  @media (min-width:860px){.grounds{grid-template-columns:1fr 1fr}}
  .ground{border-radius:14px;padding:22px;display:grid;gap:22px;min-width:0}
  .ground.light{background:#f5f5f2;color:#12110f;border:1px solid rgba(18,17,15,.12)}
  .ground.dark{background:#0e0d0c;color:#f1ede4;border:1px solid rgba(241,237,228,.08)}
  .ground h3{color:inherit;opacity:.6}
  .sizes{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
  .sizes figure{margin:0;display:grid;gap:8px;justify-items:center}
  .sizes figcaption{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
  .sizes .big{width:100%}
  .sizes .big figure{justify-items:start}
  .row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .row .mari{color:#eba21f}
  .ground.light .lk{border:1px solid rgba(18,17,15,.12)}
  .lk{display:inline-flex;padding:10px 16px;border-radius:10px}

  .sample{display:grid;gap:12px}
  .frame{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);aspect-ratio:4/5;max-height:520px}
  @media (min-width:860px){.frame{aspect-ratio:16/9}}
  .frame .pg{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 clamp(16px,4%,40px)}
  .frame .pg-hd{display:flex;align-items:center;justify-content:space-between;min-height:64px;border-bottom:1px solid var(--line)}
  .frame .pg-hd .nav{font-weight:600;font-size:15px;text-decoration:none}
  .frame .pg-hero{flex:1;display:grid;align-content:center;gap:18px;max-width:560px}
  .frame .pg-hero h2{font-size:clamp(26px,4.2vw,44px)}
  .frame .pg-hero p{color:var(--ink2)}
  .frame .pg-hero .btn{justify-self:start}
  .sample .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .sample .bar small{color:var(--ink2)}
  .sample .bar .stat{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink2)}
  .files{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px}
  .files a{text-decoration:underline;text-decoration-color:var(--marigold);text-underline-offset:4px;text-decoration-thickness:2px}
  footer{padding:36px 0 60px;color:var(--ink2);font-size:14px;border-top:1px solid var(--line)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script src="copy.js"></script>

<header class="hd">
  <div class="wrap">
    <span id="site-lockup"></span>
    <span class="spacer"></span>
    <button class="btn" id="theme" type="button"></button>
    <label class="sw" id="motion-label">
      <button class="sw-control" id="motion" type="button" role="switch" aria-checked="false"><span class="sw-thumb"></span></button>
      <span data-c="motion label"></span>
    </label>
  </div>
</header>

<main data-page="site">
  <div class="wrap">
    <section class="lede">
      <h1 data-c="title"></h1>
      <p data-c="text"></p>
      <p class="pick" id="pick"></p>
      <p id="motion-note" data-c="motion note" style="font-size:15px"></p>
    </section>
    <div id="options"></div>
  </div>
  <footer><div class="wrap">marks.js, intro.js, copy.js and one favicon per option sit beside this page.</div></footer>
</main>

<script type="module">
  import { MARKS, ORDER, mark, wordmark, LOCKUP_CSS } from "./marks.js";
  import { startIntro, sessionSeen } from "./intro.js";

  // ---- copy.js: "## section" then "label: text" ----
  const C = {};
  let sec = "";
  (window.KARMAN_LOGO_COPY || "").split("\n").forEach((line) => {
    if (line.startsWith("## ")) { sec = line.slice(3).trim(); C[sec] = C[sec] || {}; return; }
    if (!sec || line.startsWith("#") || !line.includes(":")) return;
    const i = line.indexOf(":");
    C[sec][line.slice(0, i).trim()] = line.slice(i + 1).trim();
  });
  const G = C.Gallery || {};
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  document.querySelectorAll("[data-c]").forEach((el) => { el.textContent = G[el.dataset.c] || ""; });
  const pick = document.getElementById("pick");
  pick.innerHTML = esc(G.recommendation).replace(/Ascent/, "<b>Ascent</b>");

  const style = document.createElement("style");
  style.textContent = LOCKUP_CSS;
  document.head.appendChild(style);

  const RECOMMENDED = ORDER[0];
  document.getElementById("site-lockup").innerHTML = wordmark(RECOMMENDED, { size: 23, href: "#" });

  // ---- theme toggle (rule 33) ----
  const themeBtn = document.getElementById("theme");
  const paintTheme = () => {
    const t = document.documentElement.getAttribute("data-theme");
    themeBtn.textContent = t === "dark" ? G["theme light"] : G["theme dark"];
    themeBtn.setAttribute("aria-label", "Switch to " + (t === "dark" ? "light" : "dark") + " mode");
  };
  themeBtn.addEventListener("click", () => {
    const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("karman-theme", t); } catch {}
    paintTheme();
  });
  paintTheme();

  // ---- reduced motion switch (ported 21st.dev switch, see the CSS) ----
  const motion = document.getElementById("motion");
  const mq = matchMedia("(prefers-reduced-motion: reduce)");
  let reduce = mq.matches;
  const paintMotion = () => { motion.setAttribute("aria-checked", String(reduce)); document.documentElement.toggleAttribute("data-reduce", reduce); };
  motion.addEventListener("click", () => { reduce = !reduce; paintMotion(); });
  mq.addEventListener?.("change", (e) => { reduce = e.matches; paintMotion(); });
  paintMotion();

  // ---- the options ----
  const sizes = [16, 32, 64];
  const strip = (id) => `<div class="sizes">${sizes.map((s) => `<figure>${mark(id, { size: s })}<figcaption>${s}</figcaption></figure>`).join("")}</div>` +
    `<div class="sizes"><div class="big"><figure>${mark(id, { size: 240 })}<figcaption>240</figcaption></figure></div></div>`;
  const ground = (id, kind) => `<div class="ground ${kind}">` +
    `<h3>${esc(kind === "light" ? G["light label"] : G["dark label"])}</h3>` + strip(id) +
    `<div class="row"><span class="mari">${mark(id, { size: 64, color: "#eba21f" })}</span><span style="opacity:.6;font-size:13px">${esc(G["marigold label"])}</span></div>` +
    `<div class="row"><span class="lk">${wordmark(id, { size: 23, tag: "span" })}</span><span class="lk">${wordmark(id, { size: 23, prep: true, tag: "span" })}</span></div>` +
    `</div>`;

  const host = document.getElementById("options");
  host.innerHTML = ORDER.map((id, i) => {
    const o = C["Option " + id] || {};
    const name = o.name || MARKS[id].name;
    return `<section class="opt" id="opt-${id}">
      <header>
        <div class="rank">${esc(G["rank label"])} ${i + 1}</div>
        <h2>${esc(name)}</h2>
        <p>${esc(o.sentence || MARKS[id].sentence)}</p>
        <p style="font-size:15px">${esc(o.opening || "")}</p>
      </header>
      <div class="grounds">${ground(id, "light")}${ground(id, "dark")}</div>
      <div class="sample">
        <div class="frame" data-frame="${id}">
          <div class="pg" data-page="sample">
            <div class="pg-hd">${wordmark(id, { size: 23 })}<a class="nav" href="#">${esc(G["sample link"])}</a></div>
            <div class="pg-hero"><h2>${esc(G["sample headline"])}</h2><p>${esc(G["sample text"])}</p><a class="btn" href="#">${esc(G["sample button"])}</a></div>
          </div>
        </div>
        <div class="bar">
          <button class="btn" type="button" data-replay="${id}">${esc(G.replay)}</button>
          <span class="stat" data-stat="${id}"></span>
          <span class="files"><a href="favicon-${id}.svg">${esc(G["favicon label"])}</a></span>
        </div>
      </div>
    </section>`;
  }).join("");

  // ---- replay into a sample header ----
  window.__introLog = [];
  window.karmanReplay = (id, opts = {}) => {
    const frame = document.querySelector(`[data-frame="${id}"]`);
    return startIntro(id, `[data-lockup="${id}"] [data-mark]`, {
      container: frame, page: frame.querySelector("[data-page]"), force: true, reducedMotion: opts.reducedMotion ?? reduce, ...opts,
    }).then((r) => {
      window.__introLog.push({ id, ...r });
      const s = document.querySelector(`[data-stat="${id}"]`);
      if (s && r.ran) s.textContent = `${r.durationMs} ms` + (r.landing ? `, landed ${r.landing.dx} px, ${r.landing.dy} px off` : "") + (r.reduced ? ", reduced motion" : "");
      return r;
    });
  };
  host.addEventListener("click", (e) => {
    const b = e.target.closest("[data-replay]");
    if (b) window.karmanReplay(b.dataset.replay);
  });

  // ---- the real opening, once per session, into this page's own header ----
  const run = () => startIntro(RECOMMENDED, `#site-lockup [data-mark]`, { page: document.querySelector('[data-page="site"]'), reducedMotion: reduce })
    .then((r) => { window.__introLog.push({ id: RECOMMENDED, site: true, ...r }); document.documentElement.removeAttribute("data-intro"); return r; });
  window.__siteIntro = sessionSeen() ? Promise.resolve({ ran: false, reason: "seen this session" }).then((r) => { document.documentElement.removeAttribute("data-intro"); window.__introLog.push({ id: RECOMMENDED, site: true, ...r }); return r; })
    : run();
</script>
</body>
</html>
