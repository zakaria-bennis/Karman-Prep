<meta name="color-scheme" content="light dark">
<script>
  /* Rule 33: the device's mode, dark when it states none, the toggle remembered. The opening runs once per session. */
  (function () {
    var t = null; try { t = localStorage.getItem("karman-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    var seen = false; try { seen = sessionStorage.getItem("karman-intro") === "1"; } catch (e) {}
    if (!seen && !/[?&]rec=/.test(location.search)) document.documentElement.setAttribute("data-intro", "");
  })();
</script>
