<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Karman | Plans and prices</title>
    <meta
      name="description"
      content="SAT practice from $0 a month, live classes ending on the March 6 SAT, and private tutoring. Two plans carry a score guarantee."
    />
    <link rel="canonical" href="https://karmanprep.com/pricing" />
    <meta property="og:title" content="Karman | Plans and prices" />
    <meta property="og:image" content="https://karmanprep.com/og/pricing.png" />
    <meta name="color-scheme" content="dark light" />
    <script>
      /* Theme before first paint (rule 33): the device decides, dark when it states nothing;
         the toggle overrides it and is remembered (same key as the home mocks). */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("karman-theme");
        } catch (e) {}
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        document.documentElement.classList.add("js");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Funnel+Sans:wght@300..800&display=swap"
    />
    <link rel="stylesheet" href="pricing.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://karmanprep.com/#org",
            "name": "Karman Prep",
            "url": "https://karmanprep.com/",
            "email": "hello@karmanprep.com"
          },
          {
            "@type": "Course",
            "name": "The March SAT Program",
            "provider": { "@id": "https://karmanprep.com/#org" },
            "url": "https://karmanprep.com/program",
            "offers": { "@type": "Offer", "price": "995", "priceCurrency": "USD" }
          },
          {
            "@type": "FAQPage",
            "@id": "https://karmanprep.com/pricing#questions"
          }
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip" href="#main" data-copy="header.skip"></a>

    <!-- The ground, after the Paddle Billing starter kit's home-page background
         (github.com/PaddleHQ/paddle-nextjs-starter-kit, Apache-2.0, src/components/gradients/
         home-page-background.tsx and src/styles/home-page.css): a faint grid faded from the top,
         a soft light field, grain. Redrawn in CSS and recoloured to marigold and pine. -->
    <div class="ground" aria-hidden="true">
      <div class="ground-grid"></div>
      <div class="ground-field"></div>
    </div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <!-- The Karman wordmark (from ../numbers): one stroke weight, round ends. -->
        <g
          id="wordmark-paths"
          fill="none"
          stroke="currentColor"
          stroke-width="2.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2.4 2.6 V21.6 M14 2.6 L3 14.2 M7.4 9.8 L14.6 21.6" />
          <path d="M30.2 10.2 V21.6 M30.2 15.9 a6 6 0 1 1 -12 0 a6 6 0 1 1 12 0" />
          <path d="M35.8 10.2 V21.6 M35.8 15.4 C 35.8 11.8 38.6 10 42.6 10.4" />
          <path
            d="M47.4 10.2 V21.6 M47.4 14.6 C 47.4 11.6 49.4 10.1 51.9 10.1 C 54.4 10.1 55.9 11.6 55.9 14.6 V21.6 M55.9 14.6 C 55.9 11.6 57.9 10.1 60.4 10.1 C 62.9 10.1 64.4 11.6 64.4 14.6 V21.6"
          />
          <path d="M81.4 10.2 V21.6 M81.4 15.9 a6 6 0 1 1 -12 0 a6 6 0 1 1 12 0" />
          <path
            d="M87 10.2 V21.6 M87 14.6 C 87 11.6 89.5 10.1 92.4 10.1 C 95.4 10.1 97.4 11.6 97.4 14.6 V21.6"
          />
        </g>

        <!-- Karman's own plan icons, drawn on a 24-unit grid (never Lucide). -->
        <g
          id="i-free"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="6" y="3.5" width="12" height="17" rx="2.6" />
          <path d="M9.2 8.6 C 10.6 8.4, 13.2 8.5, 14.8 8.4 M9.2 12 C 10.8 11.9, 12.2 12, 13 11.9" />
          <path d="M9.4 16.6 C 11 16.4, 12.6 14.6, 13.6 12.8" />
        </g>
        <g
          id="i-platform"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="4" y="6.5" width="11.5" height="14" rx="2.4" />
          <path
            d="M8.5 4.2 C 8.6 3.7, 9 3.5, 9.6 3.5 H18 C 19.2 3.5, 20 4.3, 20 5.5 V15.4 C 20 16, 19.7 16.4, 19.2 16.5"
          />
          <path d="M7.2 16.8 C 8.8 16.6, 10.4 14.6, 11.4 12.6" />
        </g>
        <g
          id="i-plus"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3.5" y="8.5" width="10.5" height="12.5" rx="2.2" />
          <path
            d="M7 6.3 C 7.1 5.8, 7.5 5.6, 8.1 5.6 H15 C 16.2 5.6, 17 6.4, 17 7.6 V16.2 C 17 16.8, 16.7 17.2, 16.2 17.3"
          />
          <path
            d="M10.4 3.4 C 10.5 3, 10.9 2.8, 11.4 2.8 H18.4 C 19.6 2.8, 20.4 3.6, 20.4 4.8 V13 C 20.4 13.6, 20.1 14, 19.6 14.1"
          />
          <path d="M6.4 17.6 C 7.8 17.4, 9.2 15.6, 10 13.8" />
        </g>
        <g
          id="i-cohort"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="7.6" r="2.6" />
          <circle cx="5.6" cy="10" r="2.1" />
          <circle cx="18.4" cy="10" r="2.1" />
          <path d="M7.6 19.6 C 7.8 15.8, 9.6 13.6, 12 13.6 C 14.4 13.6, 16.2 15.8, 16.4 19.6" />
          <path d="M2.4 18.6 C 2.6 15.8, 3.8 14.6, 5.6 14.6 C 6.2 14.6, 6.7 14.7, 7.1 15" />
          <path d="M21.6 18.6 C 21.4 15.8, 20.2 14.6, 18.4 14.6 C 17.8 14.6, 17.3 14.7, 16.9 15" />
        </g>
        <g
          id="i-private"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="7.4" cy="8.4" r="2.6" />
          <circle cx="16.6" cy="8.4" r="2.6" />
          <path d="M2.6 19.6 C 2.8 15.8, 4.6 13.8, 7.4 13.8 C 9 13.8, 10.2 14.4, 11 15.6" />
          <path d="M21.4 19.6 C 21.2 15.8, 19.4 13.8, 16.6 13.8 C 15 13.8, 13.8 14.4, 13 15.6" />
        </g>
        <!-- Feature mark: the rising arc of Karman's logo, small. -->
        <g id="i-mark" fill="none" stroke="currentColor" stroke-linecap="round">
          <path d="M3.2 15.4 C 7 15.1, 11.4 12.4, 14.6 3.6" stroke-width="2" />
          <path d="M2.6 8.6 C 6.4 8.2, 11 8.6, 17.4 8.1" stroke-width="1.5" opacity="0.55" />
        </g>
        <!-- Guarantee seal: a ring with the rising arc inside. -->
        <g
          id="i-seal"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="10" cy="10" r="8" stroke-width="1.6" />
          <path d="M6 13.4 C 8.4 13.2, 11 11.4, 12.8 6.4" stroke-width="1.8" />
        </g>
        <g
          id="i-chev"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 8 L10 13 L15 8" />
        </g>
      </defs>
    </svg>

    <!-- Floating pill navigation (21st.dev 18090 Floating Navbar, arihantcodes, as ported in
         ../numbers): the inset pill, round controls. No button here, so the featured card holds
         the one highlighted button (rule 35). Hides on scroll down. -->
    <header class="nav-wrap" id="header">
      <div class="nav-pill">
        <a class="brand" href="https://karmanprep.com/" data-copy-aria="header.home">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <path class="mark-line" d="M3 12.6 C 10 11.7, 20 12.7, 29 11.8" />
            <path class="mark-arc" d="M4.5 28 C 12 27.4, 20.5 21, 26.5 5.5" />
          </svg>
          <svg class="word" viewBox="0 0 100 24" aria-hidden="true">
            <use href="#wordmark-paths" />
          </svg>
        </a>
        <nav class="nav" aria-label="Sections">
          <a href="#plans" data-copy="header.nav_plans"></a>
          <a href="#compare" data-copy="header.nav_compare"></a>
          <a href="#guarantee" data-copy="header.nav_guarantee"></a>
          <a href="#questions" data-copy="header.nav_questions"></a>
        </nav>
        <div class="nav-end">
          <button class="round" type="button" id="themeToggle">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle
                cx="12"
                cy="12"
                r="8.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path d="M12 3.8 A8.2 8.2 0 0 1 12 20.2 Z" fill="currentColor" />
            </svg>
          </button>
          <button
            class="menu-btn"
            type="button"
            id="menuBtn"
            aria-expanded="false"
            aria-controls="sheet"
            data-copy="header.menu"
          ></button>
        </div>
      </div>
    </header>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Menu" hidden>
      <div class="sheet-inner">
        <button
          class="menu-btn sheet-close"
          type="button"
          id="sheetClose"
          data-copy="header.close"
        ></button>
        <nav aria-label="Sections">
          <a href="#plans" data-copy="header.nav_plans"></a>
          <a href="#compare" data-copy="header.nav_compare"></a>
          <a href="#guarantee" data-copy="header.nav_guarantee"></a>
          <a href="#questions" data-copy="header.nav_questions"></a>
        </nav>
      </div>
    </div>

    <main id="main">
      <!-- 1. Hero: a short big headline, one line under it, the control (after the starter's
           hero-section.tsx and toggle.tsx). -->
      <section class="hero" id="top">
        <div class="wrap hero-text">
          <h1 class="display" data-copy="hero.headline"></h1>
          <p class="sub" data-copy="hero.sub"></p>
          <!-- Segmented Tabs (21st.dev 26923, micka_design, as ported in ../numbers): a pill
               track with a sliding selected background; arrow keys, Home and End. -->
          <div class="seg" id="seg" role="tablist" data-copy-aria="hero.view_label">
            <span class="seg-ind" aria-hidden="true"></span>
            <button
              type="button"
              role="tab"
              id="tab-own"
              data-view="own"
              aria-controls="plans"
              data-copy="hero.own"
            ></button>
            <button
              type="button"
              role="tab"
              id="tab-tutor"
              data-view="tutor"
              aria-controls="plans"
              data-copy="hero.tutor"
            ></button>
          </div>
        </div>
      </section>

      <!-- 2. The cards: port of the starter's price-cards.tsx, price-title.tsx, price-amount.tsx
           and features-list.tsx (Apache-2.0) as plain HTML. Anatomy in the starter's order:
           icon and name (badge on the featured card), the 80 px price, its suffix, a hairline,
           who it is for, the button, the features. Filled by pricing.js from copy.js. -->
      <section class="plans" id="plans" role="tabpanel" aria-labelledby="tab-own" tabindex="-1">
        <div class="wrap">
          <h2 class="vh" data-copy="header.nav_plans"></h2>
          <div class="cards" id="cards">
            <div class="slot" data-slot="0"></div>
            <div class="slot" data-slot="1"></div>
            <div class="slot" data-slot="2"></div>
          </div>
          <p class="school">
            <span data-copy="school.text"></span>
            <a class="text-link" data-copy="school.link" data-href="school.href"></a>
          </p>
        </div>
      </section>

      <!-- 3. A short real-product moment: the iPhone 17 Pro Max (../../motion/device) playing the
           12 s tour clip, cropped to its screen. -->
      <section class="moment">
        <div class="stage moment-stage">
          <div class="moment-text">
            <h2 class="h2" data-copy="moment.headline"></h2>
            <p class="sub on-pine" data-copy="moment.sub"></p>
          </div>
          <div class="moment-media">
            <div
              class="phone"
              data-phone
              data-clip="tour"
              role="img"
              data-copy-aria="moment.phone_alt"
            ></div>
          </div>
        </div>
      </section>

      <!-- 4. Compact comparison: follows the control, three plans at a time. -->
      <section class="compare" id="compare">
        <div class="wrap">
          <h2 class="h2" data-copy="compare.headline"></h2>
          <div class="table-card">
            <table class="table" id="table">
              <caption class="vh" data-copy="compare.caption"></caption>
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 5. The guarantee, in plain words from offer.ts. -->
      <section class="guarantee" id="guarantee">
        <div class="stage g-stage">
          <div class="g-text">
            <svg class="g-seal" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-seal" /></svg>
            <h2 class="h2" data-copy="guarantee.headline"></h2>
            <p class="sub on-clay" data-copy="guarantee.sub"></p>
          </div>
          <div class="g-body">
            <table class="g-table">
              <thead>
                <tr>
                  <th scope="col" data-copy="guarantee.head_result"></th>
                  <th scope="col" data-copy="guarantee.head_remedy"></th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <th scope="row" data-copy="guarantee.r1_result"></th>
                  <td data-copy="guarantee.r1_remedy"></td>
                </tr>
                <tr>
                  <th scope="row" data-copy="guarantee.r2_result"></th>
                  <td data-copy="guarantee.r2_remedy"></td>
                </tr>
                <tr>
                  <th scope="row" data-copy="guarantee.r3_result"></th>
                  <td data-copy="guarantee.r3_remedy"></td>
                </tr>
              </tbody>
            </table>
            <p class="g-private" data-copy="guarantee.private"></p>
            <p class="g-terms" data-copy="guarantee.terms"></p>
            <a class="text-link on-dark" data-copy="guarantee.link" data-href="guarantee.href"></a>
          </div>
        </div>
      </section>

      <!-- 6. FAQ: Accordion (21st.dev 23530, ddoemonn) ported to plain JS + GSAP: one open at a
           time, measured height, chevron turns, arrow keys, Home and End. -->
      <section class="faq" id="questions">
        <div class="wrap faq-grid">
          <h2 class="h2" data-copy="faq.headline"></h2>
          <div class="acc" id="acc"></div>
        </div>
      </section>

      <!-- 7. Close: the free practice test. -->
      <section class="close">
        <div class="stage close-stage">
          <h2 class="h2" data-copy="close.headline"></h2>
          <p class="sub" data-copy="close.sub"></p>
          <a class="btn btn-lg btn-hi" data-copy="close.cta" data-href="close.href"></a>
        </div>
      </section>
    </main>

    <!-- Footer card with the cropped wordmark (after 21st.dev 35508 Giant Wordmark Footer, as in
         ../numbers). -->
    <footer class="footer">
      <div class="footer-card">
        <div class="footer-row">
          <ul class="footer-links">
            <li><a href="https://karmanprep.com/terms" data-copy="footer.terms"></a></li>
            <li><a href="https://karmanprep.com/privacy" data-copy="footer.privacy"></a></li>
            <li><a href="https://karmanprep.com/cookies" data-copy="footer.cookies"></a></li>
            <li><a href="mailto:hello@karmanprep.com" data-copy="footer.contact"></a></li>
          </ul>
          <div class="footer-controls">
            <div class="switch" role="radiogroup" data-copy-aria="footer.theme_label">
              <button
                type="button"
                role="radio"
                data-theme-set="auto"
                data-copy="footer.theme_auto"
              ></button>
              <button
                type="button"
                role="radio"
                data-theme-set="light"
                data-copy="footer.theme_light"
              ></button>
              <button
                type="button"
                role="radio"
                data-theme-set="dark"
                data-copy="footer.theme_dark"
              ></button>
            </div>
            <button
              class="text-link on-dark"
              type="button"
              id="motionToggle"
              data-copy="footer.pause"
            ></button>
          </div>
        </div>
        <p class="legal" data-copy="footer.legal"></p>
        <svg class="footer-word" viewBox="0 0 100 24" aria-hidden="true">
          <use href="#wordmark-paths" />
        </svg>
      </div>
    </footer>

    <script src="copy.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
      integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt"
      crossorigin="anonymous"
    ></script>
    <script src="pricing.js"></script>
  </body>
</html>
