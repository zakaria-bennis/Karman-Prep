    <script>
      /* Theme before first paint: the remembered choice, else the device, else dark (rule 33).
         The opening plays on the first visit only. */
      (function () {
        var d = document.documentElement,
          t = null,
          seen = null;
        d.classList.remove("no-js");
        d.classList.add("js");
        try {
          t = localStorage.getItem("karman-theme");
          seen = localStorage.getItem("karman-portal-opening");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        d.setAttribute("data-theme", t);
        if (!seen) d.classList.add("is-opening");
      })();
    </script>

  <body>
    <a class="skip" href="#main" data-copy="header.skip">Skip to the page</a>

    <!-- Floating pill navigation, after 21st.dev 18090 (Floating Navbar, arihantcodes) and the glass of
         26786 (Elevate Navbar). Ported to plain HTML: no icons, no dropdown. It hides while the reader
         scrolls down and returns on scroll up, so it never sits on text being read (rule 34). -->
    <header class="nav" id="top-nav">
      <div class="nav__pill">
        <a class="brand" href="#top" data-copy-label="header.home">
          <svg class="brand__mark" viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
            <use href="#mark" />
          </svg>
          <svg class="brand__word" viewBox="0 0 142 36" width="84" height="21" aria-hidden="true">
            <use href="#wordmark" />
          </svg>
        </a>
        <nav class="nav__links" aria-label="Sections">
          <a href="#platform" data-copy="header.nav.platform"></a>
          <a href="#week" data-copy="header.nav.week"></a>
          <a href="#results" data-copy="header.nav.results"></a>
          <a href="#plans" data-copy="header.nav.plans"></a>
        </nav>
        <button class="nav__theme" type="button" data-theme-flip aria-live="polite">Light</button>
        <button
          class="nav__menu"
          type="button"
          aria-expanded="false"
          aria-controls="sheet"
          data-copy="header.menu"
        >
          Menu
        </button>
      </div>
    </header>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Menu" hidden>
      <button class="sheet__close" type="button" data-copy="header.close">Close</button>
      <nav aria-label="Sections">
        <a href="#platform" data-copy="header.nav.platform"></a>
        <a href="#week" data-copy="header.nav.week"></a>
        <a href="#results" data-copy="header.nav.results"></a>
        <a href="#plans" data-copy="header.nav.plans"></a>
      </nav>
      <button class="sheet__theme" type="button" data-theme-flip>Light</button>
    </div>

    <main id="main">
      <!-- 1. The hero, and the camera push. A framed stage: the headline on the left, a photograph of
           students in a real place on the right, and their iPhone 17 Pro Max floating over it with the
           real Karman Home. On desktop with motion, one sticky stage of 100vh plus 150vh of scroll: the
           camera pushes into the phone until its screen fills the view (the window-opening mechanic of
           21st.dev 24466, Scroll Reveal Image, unlumen, rebuilt as one uniform camera scale). -->
      <div class="portal" data-portal id="top">
        <div class="portal__stage">
          <section class="hero" aria-labelledby="hero-title">
            <div class="hero__card">
              <div class="hero__copy">
                <!-- Announcement pill, after 21st.dev 983 (Hero Pill, originui). A text link, never filled. -->
                <a class="pill" data-href="hero.pill.url" href="#"
                  ><span class="pill__dot" aria-hidden="true"></span
                  ><span data-copy="hero.pill"></span
                  ><svg class="pill__chev" viewBox="0 0 12 12" aria-hidden="true">
                    <path
                      d="M4.5 2.5 8 6l-3.5 3.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    /></svg
                ></a>
                <h1
                  id="hero-title"
                  class="hero__title rise-lines"
                  data-copy-rich="hero.headline"
                ></h1>
                <p class="hero__sub" data-copy="hero.sub"></p>
                <a class="button" data-href="hero.button.url" data-copy="hero.button" href="#"></a>
              </div>
              <div class="hero__media">
                <figure class="hero__photo">
                  <img
                    data-slot="hero"
                    data-copy-alt="hero.photo.alt"
                    alt=""
                    width="1920"
                    height="1072"
                    fetchpriority="high"
                    decoding="async"
                  />
                </figure>
                <div class="hero__field" aria-hidden="true"></div>
                <div
                  class="phone hero__phone"
                  data-phone="hero"
                  data-copy-label="hero.phone.alt"
                  role="img"
                ></div>
              </div>
            </div>
          </section>
          <div class="portal__ground" aria-hidden="true"></div>
        </div>
      </div>

      <!-- 2. Inside the product: five real screens in the phone, swapped by tabs. Vertical tab list beside
           a panel, after 21st.dev 27081 (Feature Tab Switcher, Hirael / Mohammad Shehadeh, MIT): arrow
           keys move between tabs and the panel follows. Recoloured with Karman's tokens, no icons. -->
      <section class="platform" id="platform" aria-labelledby="platform-title">
        <div class="platform__inner">
          <div class="platform__head">
            <h2 id="platform-title" class="h2 rise-lines" data-copy="platform.headline"></h2>
            <p class="sub" data-copy="platform.sub"></p>
          </div>
          <div
            class="tabs"
            role="tablist"
            aria-orientation="vertical"
            data-copy-label="platform.tabs.label"
          >
            <span class="tabs__glide" aria-hidden="true"></span>
            <button
              class="tab"
              role="tab"
              id="tab-home"
              aria-controls="screen"
              data-tab="home"
              aria-selected="true"
            >
              <span class="tab__name" data-copy="platform.home.tab"></span
              ><span class="tab__line" data-copy="platform.home.line"></span>
            </button>
            <button
              class="tab"
              role="tab"
              id="tab-daily"
              aria-controls="screen"
              data-tab="daily"
              aria-selected="false"
              tabindex="-1"
            >
              <span class="tab__name" data-copy="platform.daily.tab"></span
              ><span class="tab__line" data-copy="platform.daily.line"></span>
            </button>
            <button
              class="tab"
              role="tab"
              id="tab-calendar"
              aria-controls="screen"
              data-tab="calendar"
              aria-selected="false"
              tabindex="-1"
            >
              <span class="tab__name" data-copy="platform.calendar.tab"></span
              ><span class="tab__line" data-copy="platform.calendar.line"></span>
            </button>
            <button
              class="tab"
              role="tab"
              id="tab-progress"
              aria-controls="screen"
              data-tab="progress"
              aria-selected="false"
              tabindex="-1"
            >
              <span class="tab__name" data-copy="platform.progress.tab"></span
              ><span class="tab__line" data-copy="platform.progress.line"></span>
            </button>
            <button
              class="tab"
              role="tab"
              id="tab-parent"
              aria-controls="screen"
              data-tab="parent"
              aria-selected="false"
              tabindex="-1"
            >
              <span class="tab__name" data-copy="platform.parent.tab"></span
              ><span class="tab__line" data-copy="platform.parent.line"></span>
            </button>
          </div>
          <p class="platform__caption" aria-hidden="true"></p>
          <div
            class="platform__stage"
            id="screen"
            role="tabpanel"
            aria-labelledby="tab-home"
            tabindex="0"
          >
            <div class="platform__field" aria-hidden="true"></div>
            <div class="phone platform__phone land-settle" data-phone="platform" role="img"></div>
          </div>
        </div>
      </section>

      <!-- 3. A week, as a bento of live product tiles (modern-UI 2.5), with a pointer spotlight on
           desktop after 21st.dev 35180 (Spotlight, kevingirelli). Bento container after 21st.dev 622. -->
      <section class="week" id="week" aria-labelledby="week-title">
        <h2 id="week-title" class="h2 rise-lines" data-copy="week.headline"></h2>
        <div class="bento">
          <article class="tile tile--try spot">
            <div class="tile__head">
              <h3 class="h3" data-copy="week.try.title"></h3>
              <p class="tile__sub" data-copy="week.try.sub"></p>
            </div>
            <p class="try__prompt" data-copy="week.try.prompt"></p>
            <!-- Live fragment of the real Karman quiz engine (redesign/engine/fragments/alg-1.html). -->
            <div
              class="try__frame land-settle"
              data-fragment="../../redesign/engine/fragments/alg-1.html"
              data-ui
            >
              <p class="try__loading" data-copy="week.try.loading"></p>
            </div>
            <p class="try__result" aria-live="polite"></p>
            <button
              class="textlink try__again"
              type="button"
              data-copy="week.try.again"
              hidden
            ></button>
          </article>

          <article class="tile tile--zoom spot">
            <div class="tile__phone">
              <div
                class="phone zoom__phone"
                data-phone="zoom"
                data-screen="tutor"
                role="img"
                data-copy-label="week.zoom.alt"
              ></div>
            </div>
            <h3 class="h3" data-copy="week.zoom.title"></h3>
            <p class="tile__sub" data-copy="week.zoom.sub"></p>
          </article>

          <article class="tile tile--start spot">
            <div class="tile__phone start__stage">
              <div
                class="phone start__phone"
                data-phone="start"
                data-screen="schedule"
                role="img"
                data-copy-label="week.start.alt"
              ></div>
            </div>
            <div class="start__body">
              <p class="start__date" data-copy="week.start.date"></p>
              <p class="tile__sub" data-copy="week.start.line"></p>
              <a
                class="textlink"
                data-href="week.start.link.url"
                data-copy="week.start.link"
                href="#"
              ></a>
            </div>
          </article>

          <article class="tile tile--handoff spot">
            <figure class="handoff" data-ui>
              <video
                class="clip"
                data-clip="handoff"
                muted
                playsinline
                loop
                preload="none"
                data-copy-label="week.handoff.label"
              ></video>
            </figure>
            <h3 class="h3" data-copy="week.handoff.title"></h3>
            <p class="tile__sub" data-copy="week.handoff.sub"></p>
          </article>
        </div>
      </section>

      <!-- 4. Results: the colour beat, in a rounded pine card. One count with its source beside it
           (copy rule 20), then the three approved results in a hairline grid (modern-UI 2.14). -->
      <section class="results" id="results" aria-labelledby="results-title">
        <div class="results__card">
          <div class="results__head">
            <h2 id="results-title" class="h2 rise-lines" data-copy="results.headline"></h2>
            <p class="results__range">
              <span data-copy="results.range"></span>
              <span class="results__num" data-count data-copy="results.number"></span>
            </p>
            <p class="results__label" data-copy="results.label"></p>
          </div>
          <ul class="results__grid">
            <li>
              <img
                data-slot="resultAva"
                data-copy-alt="results.ava.alt"
                alt=""
                width="800"
                height="450"
                loading="lazy"
                decoding="async"
              />
              <p>
                <span class="r-name" data-copy="results.ava.name"></span
                ><span class="r-score" data-copy="results.ava.score"></span
                ><span class="r-school" data-copy="results.ava.school"></span>
              </p>
            </li>
            <li>
              <img
                data-slot="resultMateo"
                data-copy-alt="results.mateo.alt"
                alt=""
                width="800"
                height="450"
                loading="lazy"
                decoding="async"
              />
              <p>
                <span class="r-name" data-copy="results.mateo.name"></span
                ><span class="r-score" data-copy="results.mateo.score"></span
                ><span class="r-school" data-copy="results.mateo.school"></span>
              </p>
            </li>
            <li>
              <img
                data-slot="resultPriya"
                data-copy-alt="results.priya.alt"
                alt=""
                width="800"
                height="450"
                loading="lazy"
                decoding="async"
              />
              <p>
                <span class="r-name" data-copy="results.priya.name"></span
                ><span class="r-score" data-copy="results.priya.score"></span
                ><span class="r-school" data-copy="results.priya.school"></span>
              </p>
            </li>
          </ul>
        </div>
      </section>

      <!-- 5. Plans as two cards (the founder's Paddle decision allows tier cards). Actions are text links,
           so the page keeps one highlighted button on screen (rule 35). -->
      <section class="plans" id="plans" aria-labelledby="plans-title">
        <h2 id="plans-title" class="h2 rise-lines" data-copy="plans.headline"></h2>
        <div class="plans__cards">
          <article class="plan spot">
            <h3 class="plan__name" data-copy="plans.plus.name"></h3>
            <p class="plan__price">
              <span class="plan__amount" data-copy="plans.plus.price"></span>
              <span class="plan__note" data-copy="plans.plus.note"></span>
            </p>
            <ul class="plan__list">
              <li data-copy="plans.plus.1"></li>
              <li data-copy="plans.plus.2"></li>
              <li data-copy="plans.plus.3"></li>
            </ul>
          </article>
          <article class="plan plan--pick spot">
            <div class="plan__body">
              <h3 class="plan__name" data-copy="plans.cohort.name"></h3>
              <p class="plan__price">
                <span class="plan__amount land-settle" data-copy="plans.cohort.price"></span>
                <span class="plan__note" data-copy="plans.cohort.note"></span>
              </p>
              <ul class="plan__list">
                <li data-copy="plans.cohort.1"></li>
                <li data-copy="plans.cohort.2"></li>
                <li data-copy="plans.cohort.3"></li>
              </ul>
            </div>
          </article>
        </div>
        <p class="plans__links">
          <a
            class="textlink"
            data-href="plans.link.all.url"
            data-copy="plans.link.all"
            href="#"
          ></a>
          <a
            class="textlink"
            data-href="plans.link.guarantee.url"
            data-copy="plans.link.guarantee"
            href="#"
          ></a>
        </p>
      </section>

      <!-- 6. Close: a night card. Objection, then the one button (copy rule 19). -->
      <section class="close" id="close" aria-labelledby="close-title">
        <div class="close__card">
          <figure class="close__photo">
            <img
              data-slot="closeParent"
              data-copy-alt="close.photo.alt"
              alt=""
              width="880"
              height="1184"
              loading="lazy"
              decoding="async"
            />
          </figure>
          <div class="close__body">
            <h2 id="close-title" class="h2 rise-lines" data-copy="close.headline"></h2>
            <p class="sub" data-copy="close.sub"></p>
            <p class="close__objection" data-copy="close.objection"></p>
            <a
              class="button land-settle"
              data-href="close.button.url"
              data-copy="close.button"
              href="#"
            ></a>
            <p class="close__date" data-copy="close.date"></p>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer card with the wordmark cropped by its bottom edge, after 21st.dev 35508
         (Giant Wordmark Footer, kedhareswer). -->
    <footer class="foot">
      <div class="foot__card">
        <div class="foot__row">
          <a
            class="foot__contact"
            data-href="footer.contact.url"
            data-copy="footer.contact"
            href="#"
          ></a>
          <nav class="foot__legal" aria-label="Legal">
            <a data-href="footer.terms.url" data-copy="footer.terms" href="#"></a>
            <a data-href="footer.privacy.url" data-copy="footer.privacy" href="#"></a>
            <a data-href="footer.cookies.url" data-copy="footer.cookies" href="#"></a>
            <a href="#top" data-copy="footer.top"></a>
          </nav>
          <!-- Two-option segmented switch, after 21st.dev 37721 (Theme Switch, zweiundeins). -->
          <div class="theme" role="radiogroup" data-copy-label="header.theme.label">
            <button
              type="button"
              role="radio"
              data-theme-set="light"
              data-copy="header.theme.light"
            ></button>
            <button
              type="button"
              role="radio"
              data-theme-set="dark"
              data-copy="header.theme.dark"
            ></button>
          </div>
        </div>
        <p class="foot__year" data-copy="footer.year"></p>
        <svg class="foot__word" viewBox="0 0 142 36" aria-hidden="true">
          <use href="#wordmark" />
        </svg>
      </div>
