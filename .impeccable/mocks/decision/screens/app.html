<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karman</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f151d;--s1:#17202b;--s2:#202b38;--ink:#eef0ee;--ink2:#a7b1bc;--line:#2a3644;--acc:#7cc4a5;--accf:#1e5b4b;--och:#e2b867;--ox:#e3959c;--btn:#eef0ee;--btnink:#0f151d;--g:#3f8a6c;--y:#b8862a;--x:#2b3644}
:root[data-t=light]{--bg:#f1f1ee;--s1:#fafaf7;--s2:#e9e9e4;--ink:#15202e;--ink2:#4f5b68;--line:#d9d9d2;--acc:#1e5b4b;--accf:#1e5b4b;--och:#85570c;--ox:#7b2d35;--btn:#15202e;--btnink:#f1f1ee;--g:#2f7a5c;--y:#b07d1e;--x:#8a929b}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.ser{font-family:"Source Serif 4",Georgia,serif;font-weight:500;letter-spacing:-.01em}
.muted{color:var(--ink2)} .small{font-size:14px} .center{text-align:center}
small{display:block;font-size:13px}
.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:14px 30px 0 34px;font-weight:600;font-size:16px}
.sbr{display:flex;gap:7px;align-items:center} .sbr svg{fill:currentColor}
.ph{padding:8px 20px 24px;display:flex;flex-direction:column;gap:14px;min-height:calc(100% - 54px)}
.ph h1{font-size:34px;line-height:1.1}
.h1s{font-size:28px !important}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 0 4px;font-size:15px}
.top>:last-child{text-align:right}
.bar{height:4px;background:var(--s2);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.hero-card{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:16px}
.hero-card .big{font-size:30px;display:block;line-height:1.15}
.hc-r{border-left:1px solid var(--line);padding-left:14px}.hc-r b{display:block;margin:2px 0}
.h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--s1)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px}.row+.row{border-top:1px solid var(--line)}
.row b{display:block;font-weight:600}
.pill{font-size:13px;padding:4px 9px;border-radius:5px;background:var(--s2);white-space:nowrap}.pill.new{background:var(--accf);color:#eef0ee}
.btn{appearance:none;border:0;background:var(--btn);color:var(--btnink);font:600 16px/1 "Hanken Grotesk",sans-serif;padding:15px 22px;border-radius:7px}
.btn.wide{width:100%;margin-top:auto}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding:12px 8px 0;text-align:center;font-size:13px;color:var(--ink2)}
.tabs .on{color:var(--ink);font-weight:600}
body.phone .ph{padding-bottom:104px}
.tag{align-self:flex-start;font-size:13px;font-weight:600;padding:4px 9px;border-radius:5px;background:color-mix(in srgb,var(--och) 18%,transparent);color:var(--och)}
.skill{font-size:13px;margin-top:-6px}
.q{font-family:"Source Serif 4",Georgia,serif;font-size:21px;line-height:1.45}
.q2{font-size:15px;color:var(--ink2)}
.choices{display:flex;flex-direction:column;gap:9px}
.ch{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:var(--s1);font-size:17px;position:relative}
.ch i{font-style:normal;font-weight:700;width:28px;height:28px;flex:none;display:grid;place-items:center;border:1.5px solid var(--ink2);border-radius:50%;font-size:14px}
.ch.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ch.sel i{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch.right{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.ch.right i{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.ch.wrong{border-color:var(--ox);box-shadow:inset 0 0 0 1px var(--ox)}.ch.wrong i{border-color:var(--ox);color:var(--ox)}
.ch.dim{opacity:.55}
.lab{position:absolute;right:12px;top:-10px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--acc)}
.ch.wrong .lab{color:var(--ox)}
.result{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:15px}.result b{color:var(--acc)}
.tlink{text-decoration:underline;text-underline-offset:3px;font-size:15px;font-weight:600}
.board{display:flex;flex-direction:column;gap:6px;align-items:center;margin:4px 0}
.wrow{display:grid;grid-template-columns:repeat(7,44px);gap:6px}
.t{font-style:normal;height:44px;display:grid;place-items:center;font-weight:700;font-size:21px;border-radius:5px;color:#fff}
.t.g{background:var(--g)}.t.y{background:var(--y)}.t.x{background:var(--x)}.t.e{border:2px solid var(--line)}
.kbd{display:flex;flex-direction:column;gap:7px;margin-top:auto}
.krow{display:flex;gap:5px;justify-content:center}
.k{flex:0 0 31px;height:46px;display:grid;place-items:center;border-radius:5px;background:var(--s2);font-weight:600;font-size:15px}
.k.g{background:var(--g);color:#fff}.k.y{background:var(--y);color:#fff}.k.x{background:var(--x);color:#fff;opacity:.7}
.k.wide{flex:0 0 52px;font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s2);border-radius:7px;padding:3px}
.seg a{text-align:center;padding:8px;border-radius:5px;font-size:14px;color:var(--ink2)}.seg .on{background:var(--bg);color:var(--ink);font-weight:600}
.fcard{flex:1;min-height:360px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;justify-content:center;align-items:center;text-align:center}
.fcard .front{font-size:56px;line-height:1}
.rule{width:48px;height:2px;background:var(--acc)}
.meaning{font-family:"Source Serif 4",Georgia,serif;font-size:24px;line-height:1.3}
.fnav{display:flex;justify-content:space-between}
.stats,.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats>div,.kpis>div{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:14px}
.stats b,.kpis b{display:block;font-size:24px;line-height:1.2}
.note{font-family:"Source Serif 4",Georgia,serif;font-size:18px;line-height:1.5}
/* laptop */
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;background:var(--s1)}
.brand{font-family:"Source Serif 4",Georgia,serif;font-size:24px;font-weight:600;padding:0 10px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{padding:9px 10px;border-radius:6px;font-size:15px;color:var(--ink2)}.side nav a.on{background:var(--s2);color:var(--ink);font-weight:600}
.who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:0 6px}.who b{display:block;font-size:15px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accf);color:#eef0ee;display:grid;place-items:center;font-weight:700}
.main{padding:30px 40px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.mh h1{font-size:34px;line-height:1.15}
.mhr{display:flex;gap:16px;align-items:center;font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
.qwrap{max-width:760px;margin:auto;width:100%;display:flex;flex-direction:column;gap:24px}
.qbig{font-family:"Source Serif 4",Georgia,serif;font-size:28px}
.choices.lap .ch{font-size:18px}
.qfoot{display:flex;justify-content:space-between;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;flex:1}
.day{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--ink)}
.day>b{font-size:15px}
.ev{border-radius:6px;padding:9px;font-size:14px;font-weight:600;background:var(--s2)}
.ev small{font-weight:400;color:var(--ink2);margin-bottom:2px}.ev span{display:block;font-weight:400;font-size:13px;color:var(--ink2);margin-top:3px}
.ev.d10{font-weight:500;color:var(--ink2);background:transparent;border:1px dashed var(--line)}
.ev.cls{background:color-mix(in srgb,var(--accf) 45%,var(--s1))}
:root[data-t=light] .ev.cls{background:color-mix(in srgb,var(--accf) 14%,var(--s1))}
.ev.ws{background:color-mix(in srgb,var(--och) 18%,var(--s1))}
.ev.test{background:color-mix(in srgb,var(--ox) 18%,var(--s1))}
.kpis{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.panel .list{background:var(--bg)}
.wbars{display:grid;grid-template-columns:repeat(9,1fr);gap:14px;height:170px;align-items:end}
.wb{height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
.wb i{display:block;background:var(--acc);border-radius:4px 4px 0 0;min-height:4px}
.wb b{font-size:12px;font-weight:600;order:-1;color:var(--ink2)} .wb small{color:var(--ink2);font-size:12px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.rv{display:grid;grid-template-columns:1fr 1fr;gap:28px;flex:1;min-height:0}
.psg{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.verse{font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.55}
mark{background:color-mix(in srgb,var(--och) 30%,transparent);color:inherit;padding:0 2px;border-radius:2px}
.qs{display:flex;flex-direction:column;gap:12px}.q2b{font-size:17px;font-weight:600}
.qs .ch{font-size:15px;align-items:flex-start;padding:12px 14px}
.tnote{border-left:3px solid var(--och);padding:4px 0 4px 14px}.tnote b{font-size:14px;color:var(--och)}.tnote p{font-family:"Source Serif 4",Georgia,serif;font-size:16px}
</style></head><body><div id="root" style="position:relative;height:100%"></div>

ctice</a><a>Schedule</a><a>Chat</a></nav>"], "daily10": ["phone", "<div class=\"sb\"><span>6:50</span><span class=\"sbr\"><svg width=\"17\" height=\"11\" viewBox=\"0 0 17 11\"><rect x=\"0\" y=\"7\" width=\"3\" height=\"4\" rx=\"1\"/><rect x=\"4.5\" y=\"5\" width=\"3\" height=\"6\" rx=\"1\"/><rect x=\"9\" y=\"2.5\" width=\"3\" height=\"8.5\" rx=\"1\"/><rect x=\"13.5\" y=\"0\" width=\"3\" height=\"11\" rx=\"1\"/></svg><svg width=\"25\" height=\"12\" viewBox=\"0 0 25 12\"><rect x=\".5\" y=\".5\" width=\"21\" height=\"11\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" opacity=\".45\"/><rect x=\"2\" y=\"2\" width=\"15\" height=\"8\" rx=\"1.5\"/><rect x=\"22.5\" y=\"4\" width=\"1.6\" height=\"4\" rx=\".8\" opacity=\".45\"/></svg></span></div>\n<div class=\"ph\">\n <div class=\"top\"><a class=\"muted\">Close</a><b>Daily 10</b><span class=\"muted\">3 of 10</span></div>\n <div class=\"bar\"><i style=\"width:30%\"></i></div>\n <p class=\"tag\">Back from last Tuesday</p>\n <p class=\"skill muted\">Sentence boundaries and joining independent clauses</p>\n <p class=\"q\">The museum's new wing opened in ______ its first exhibit drew more visitors in one week than the old galleries had in a month.</p>\n <p class=\"q2\">Which choice completes the text so that it conforms to the conventions of Standard English?</p>\n <div class=\"choices\">\n  <a class=\"ch\"><i>A</i>March, and</a><a class=\"ch\"><i>B</i>March</a><a class=\"ch sel\"><i>C</i>March; and</a><a class=\"ch\"><i>D</i>March and</a>\n </div>\n <button class=\"btn wide\">Check</button>\n</div>"], "daily-question": ["phone", "<div class=\"sb\"><span>12:41</span><span class=\"sbr\"><svg width=\"17\" height=\"11\" viewBox=\"0 0 17 11\"><rect x=\"0\" y=\"7\" width=\"3\" height=\"4\" rx=\"1\"/><rect x=\"4.5\" y=\"5\" width=\"3\" height=\"6\" rx=\"1\"/><rect x=\"9\" y=\"2.5\" width=\"3\" height=\"8.5\" rx=\"1\"/><rect x=\"13.5\" y=\"0\" width=\"3\" height=\"11\" rx=\"1\"/></svg><svg width=\"25\" height=\"12\" viewBox=\"0 0 25 12\
