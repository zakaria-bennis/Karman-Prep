<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karman Product Screens</title>
<style>body{margin:0;background:#e6e5e0;color:#15202e;font:15px/1.5 system-ui,sans-serif} main{max-width:1400px;margin:0 auto;padding:40px 16px 80px} h1{margin:0;font-size:28px} h2{margin:40px 0 16px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:24px} .lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:32px;margin-top:32px}

.phone{background:#0b0d10;border-radius:34px;padding:9px;line-height:0} .phone img{width:100%;border-radius:26px}
.lap{background:#0b0d10;border-radius:14px 14px 0 0;padding:12px 12px 14px;line-height:0} .lap img{width:100%} .base{height:12px;background:#b9bcc1;border-radius:0 0 10px 10px;margin:0 -4%}</style></head><body><main>
