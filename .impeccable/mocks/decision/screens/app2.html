/* ---------- the question-set constellation: one star per question ---------- */
function constellation(states, opt = {}) {
  const n = states.length, W = opt.w || 400, H = opt.h || 64, pad = 14;
  const pts = states.map((s, i) => {
    const x = pad + (W - 2 * pad) * (i / (n - 1));
    const y = H / 2 + Math.sin(i * 1.15 + 0.6) * (H * 0.28) + (i % 3 === 0 ? 4 : -2);
    return [x, y];
  });
  let lines = "", marks = "";
  for (let i = 0; i < n - 1; i++) {
    const done = states[i] !== "todo" && states[i + 1] !== "todo";
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--star-line)" stroke-width="${done ? 1.4 : 1}" ${done ? "" : 'stroke-dasharray="2 5" opacity=".55"'}/>`;
  }
  const star = (x, y, r) => { let p = []; for (let k = 0; k < 8; k++) { const a = Math.PI / 4 * k - Math.PI / 2, rr = k % 2 ? r * 0.38 : r; p.push(`${(x + rr * Math.cos(a)).toFixed(1)},${(y + rr * Math.sin(a)).toFixed(1)}`); } return p.join(" "); };
  states.forEach((s, i) => {
    const [x, y] = pts[i];
    if (s === "right") marks += `<polygon points="${star(x, y, 11)}" fill="var(--acc)"/>`;
    else if (s === "wrong") marks += `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="var(--ox)" stroke-width="2"/><line x1="${x - 4}" y1="${y + 4}" x2="${x + 4}" y2="${y - 4}" stroke="var(--ox)" stroke-width="2" stroke-linecap="round"/>`;
    else if (s === "now") marks += `<circle cx="${x}" cy="${y}" r="15" fill="var(--ink)" opacity=".12"/><polygon points="${star(x, y, 12)}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>`;
    else marks += `<circle cx="${x}" cy="${y}" r="2.6" fill="var(--ink3)"/>`;
  });
  return `<svg class="const" viewBox="0 0 ${W} ${H}" role="img" aria-label="${states.filter(s => s === "right").length} right, ${states.filter(s => s === "wrong").length} wrong, question ${states.indexOf("now") + 1} of ${n}">${lines}${marks}</svg>`;
}

/* ---------- skills (exact names from the approved taxonomy); mastered at 85% or more ---------- */

  "Information and Ideas": [["Central Ideas and Details", 88], ["Command of Evidence", 72], ["Inferences", 64]],
  "Craft and Structure": [["Words in Context", 91], ["Text Structure and Purpose", 78], ["Cross-Text Connections", 58]],
  "Expression of Ideas": [["Rhetorical Synthesis", 86], ["Transitions", 82]],
  "Standard English Conventions": [["Sentence boundaries and joining independent clauses", 90], ["Joining main and dependent clauses", 87], ["Essential versus nonessential information including names and titles", 70], ["Colons and dashes introducing explanations or lists", 61], ["Lists and series", 84], ["Unnecessary punctuation within a sentence", 75], ["Subject-verb agreement", 93], ["Pronoun-antecedent agreement", 88], ["Finite versus nonfinite verb forms", 66], ["Verb tense and aspect", 79], ["Modifier placement", 57], ["Plurals possessives and contractions", 80]],
  "Algebra": [["Linear equations in one variable", 92], ["Linear equations in two variables", 74], ["Linear functions", 63], ["Systems of two linear equations in two variables", 77], ["Linear inequalities in one or two variables", 69]],
  "Advanced Math": [["Equivalent expressions", 81], ["Nonlinear equations in one variable and systems of equations in two variables", 55], ["Nonlinear functions", 52]],

function skyOf(skills, seed) {
  const W = 260, H = 116, n = skills.length;
  const pts = skills.map((s, i) => {
    const a = seed + i * 2.399, r = 0.28 + 0.62 * ((i + 1) / (n + 1));
    return [W / 2 + Math.cos(a) * r * (W * 0.46), H / 2 + Math.sin(a) * r * (H * 0.44)];
  });
  let l = "", m = "";
  for (let i = 0; i < n - 1; i++) l += `<line x1="${pts[i][0].toFixed(1)}" y1="${pts[i][1].toFixed(1)}" x2="${pts[i + 1][0].toFixed(1)}" y2="${pts[i + 1][1].toFixed(1)}" stroke="var(--star-line)" stroke-width="1"/>`;
  skills.forEach(([name, v], i) => {
    const [x, y] = pts[i], r = 2 + (v / 100) * 5;
    if (v >= 85) { let p = []; for (let k = 0; k < 8; k++) { const a = Math.PI / 4 * k - Math.PI / 2, rr = k % 2 ? r * 0.42 : r * 1.6; p.push(`${(x + rr * Math.cos(a)).toFixed(1)},${(y + rr * Math.sin(a)).toFixed(1)}`); } m += `<polygon points="${p.join(" ")}" fill="var(--och)"><title>${name}: ${v}%</title></polygon>`; }
    else m += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="var(--ink)" opacity="${(0.25 + v / 140).toFixed(2)}"><title>${name}: ${v}%</title></circle>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${l}${m}</svg>`;
}

/* ---------- word game (real daily word, accepted guesses) ---------- */
function scoreWord(g, a) { const res = Array(7).fill("x"), rem = a.split(""); for (let i = 0; i < 7; i++) if (g[i] === a[i]) { res[i] = "g"; rem[i] = null; } for (let i = 0; i < 7; i++) if (res[i] === "x") { const j = rem.indexOf(g[i]); if (j >= 0) { res[i] = "y"; rem[j] = null; } } return res; }
const GUESSES = ["STATION", "VENTURE", "NERVOUS"], ANSWER = "TENUOUS";
const KEYS = {}; const RANK = { x: 0, y: 1, g: 2 };
const BOARD = Array.from({ length: 6 }, (_, i) => {
  if (i >= GUESSES.length) return `<div class="wrow">${'<i class="t e"></i>'.repeat(7)}</div>`;
  const r = scoreWord(GUESSES[i], ANSWER);
  GUESSES[i].split("").forEach((c, k) => { if (!(c in KEYS) || RANK[r[k]] > RANK[KEYS[c]]) KEYS[c] = r[k]; });
  return `<div class="wrow">${GUESSES[i].split("").map((c, k) => `<i class="t ${r[k]}">${c}</i>`).join("")}</div>`;
}).join("");

/* the sky moves: a few stars twinkle and the field drifts very slowly (off under reduced motion) */
(function () {
  const c = document.getElementById("stars"), x = c.getContext("2d"), dpr = devicePixelRatio || 1;
  function size() { c.width = innerWidth * dpr; c.height = innerHeight * dpr; }
  size(); addEventListener("resize", size);
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stars = Array.from({ length: 38 }, () => ({ x: rnd(), y: rnd(), r: 0.5 + rnd() * 1.1, ph: rnd() * 6.28, sp: 0.4 + rnd() * 0.9 }));
  const light = t === "light" || document.body.className === "msgs", still = matchMedia("(prefers-reduced-motion: reduce)").matches || p.has("still");
  function draw(ms) {
    x.clearRect(0, 0, c.width, c.height);
    const drift = still ? 0 : ms * 0.000004;
    for (const s of stars) {
      const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(s.ph + (still ? 0 : ms * 0.001 * s.sp)));
      x.fillStyle = light ? `rgba(21,32,46,${a * 0.5})` : `rgba(220,235,255,${a})`;
      x.beginPath(); x.arc(((s.x + drift) % 1) * c.width, s.y * c.height, s.r * dpr, 0, 6.28); x.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
