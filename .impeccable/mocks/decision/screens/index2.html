<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karman App Screens</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#dcdad3;color:#15202e;font:15px/1.5 "Hanken Grotesk",system-ui,sans-serif} main{max-width:1500px;margin:0 auto;padding:40px 16px 80px} h1{margin:0;font-size:28px} h2{margin:44px 0 18px;font-size:20px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:28px} .lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:36px;margin-top:40px}
figure{margin:0} figcaption{text-align:center;margin-top:10px;font-weight:700}
/* iPhone 17 Pro Max: thin even bezel, titanium edge, Dynamic Island */
.ip{position:relative;aspect-ratio:440/956;border-radius:15.5% / 7.2%;padding:2.6%;background:#1a1c1f;box-shadow:inset 0 0 0 1.5px #5b5f66,inset 0 0 0 3px #2a2d31}
.ip img{width:100%;height:100%;display:block;border-radius:13.4% / 6.2%}
.di{position:absolute;top:3.7%;left:50%;width:28.6%;height:3.9%;transform:translateX(-50%);background:#000;border-radius:999px}
.mb{position:relative;background:#121315;border-radius:16px 16px 0 0;padding:2.2% 2.2% 2.6%;box-shadow:inset 0 0 0 1.5px #3a3c40} .mb img{width:100%;display:block;border-radius:4px}
.cam{position:absolute;top:0.8%;left:50%;width:6px;height:6px;border-radius:50%;background:#2a2c30;transform:translateX(-50%)}
.base{height:14px;background:linear-gradient(#c9ccd1,#9ea2a8);border-radius:0 0 12px 12px;margin:0 -5%}</style></head><body><main>
<h1>Karman app screens</h1><h2>Dark mode</h2><div class="pg"><figure><div class="ip"><img src="v2-student-dashboard-dark.png" alt="Student dashboard"><span class="di"></span></div><figcaption>Student dashboard</figcaption></figure><figure><div class="ip"><img src="v2-daily10-dark.png" alt="Your Daily 10"><span class="di"></span></div><figcaption>Your Daily 10</figcaption></figure><figure><div class="ip"><img src="v2-challenge-dark.png" alt="Challenge question"><span class="di"></span></div><figcaption>Challenge question</figcaption></figure><figure><div class="ip"><img src="v2-word-game-dark.png" alt="Wordline"><span class="di"></span></div><figcaption>Wordline</figcaption></figure><figure><div class="ip"><img src="v2-flashcards-dark.png" alt="Flashcards"><span class="di"></span></div><figcaption>Flashcards</figcaption></figure><figure><div class="ip"><img src="v2-parent-update-dark.png" alt="Parent weekly update"><span class="di"></span></div><figcaption>Parent weekly update</figcaption></figure></div><div class="lg"><figure><div class="mb"><img src="v2-quiz-dark.png" alt="Question bank"><span class="cam"></span></div><div class="base"></div><figcaption>Question bank</figcaption></figure><figure><div class="mb"><img src="v2-schedule-dark.png" alt="Schedule"><span class="cam"></span></div><div class="base"></div><figcaption>Schedule</figcaption></figure><figure><div class="mb"><img src="v2-progress-dark.png" alt="Skills"><span class="cam"></span></div><div class="base"></div><figcaption>Skills</figcaption></figure><figure><div class="mb"><img src="v2-parent-dashboard-dark.png" alt="Parent dashboard"><span class="cam"></span></div><div class="base"></div><figcaption>Parent dashboard</figcaption></figure><figure><div class="mb"><img src="v2-review-dark.png" alt="Full-length review"><span class="cam"></span></div><div class="base"></div><figcaption>Full-length review</figcaption></figure></div><h2>Light mode</h2><div class="pg"><figure><div class="ip"><img src="v2-student-dashboard-light.png" alt="Student dashboard"><span class="di"></span></div><figcaption>Student dashboard</figcaption></figure><figure><div class="ip"><img src="v2-daily10-light.png" alt="Your Daily 10"><span class="di"></span></div><figcaption>Your Daily 10</figcaption></figure><figure><div class="ip"><img src="v2-challenge-light.png" alt="Challenge question"><span class="di"></span></div><figcaption>Challenge question</figcaption></figure><figure><div class="ip"><img src="v2-word-game-light.png" alt="Wordline"><span class="di"></span></div><figcaption>Wordline</figcaption></figure><figure><div class="ip"><img src="v2-flashcards-light.png" alt="Flashcards"><span class="di"></span></div><figcaption>Flashcards</figcaption></figure><figure><div class="ip"><img src="v2-parent-update-light.png" alt="Parent weekly update"><span class="di"></span></div><figcaption>Parent weekly update</figcaption></figure></div><div class="lg"><figure><div class="mb"><img src="v2-quiz-light.png" alt="Question bank"><span class="cam"></span></div><div class="base"></div><figcaption>Question bank</figcaption></figure><figure><div class="mb"><img src="v2-schedule-light.png" alt="Schedule"><span class="cam"></span></div><div class="base"></div><figcaption>Schedule</figcaption></figure><figure><div class="mb"><img src="v2-progress-light.png" alt="Skills"><span class="cam"></span></div><div class="base"></div><figcaption>Skills</figcaption></figure><figure><div class="mb"><img src="v2-parent-dashboard-light.png" alt="Parent dashboard"><span class="cam"></span></div><div class="base"></div><figcaption>Parent dashboard</figcaption></figure><figure><div class="mb"><img src="v2-review-light.png" alt="Full-length review"><span class="cam"></span></div><div class="base"></div><figcaption>Full-length review</figcaption></figure></div></main></body></html>
