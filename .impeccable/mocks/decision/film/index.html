<!-- Every word comes from copy.js; site.js adds the header, menu and footer; film.js builds the sections. -->
<!-- the film: one continuous day behind the whole page, never tied to the scroll. The opening still is painted by film.css; the film's src is set by film.js after first paint (the strategy is at the top of film.js). -->
<div class="stage" aria-hidden="true">
  <video class="day" muted playsinline loop preload="auto"></video>
  <video class="edge" muted playsinline preload="none"></video>
  <div class="scrim"></div>
  <div class="haze"></div>
  <canvas class="orb" width="64" height="64"></canvas>
  <span class="late"></span>
</div>
