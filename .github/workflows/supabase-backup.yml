# ============================================================
# Supabase backup — nightly pg_dump → R2.
#
# Belt-and-suspenders on top of Supabase's built-in daily backups
# (Pro plan keeps 7 days). This workflow lifts a fresh dump every
# night and ships it to your own R2 bucket, so:
#   · You retain longer than 7 days
#   · You own the artifact (Supabase outage / account loss doesn't
#     lose your data)
#   · Restore is one `psql < backup.sql` away
#
# Schedule
# ========
# 11:00 UTC daily (04:00 PT). Picked to avoid colliding with the
# audit workflows (09:00 / 13:00 UTC).
#
# Storage layout
# ==============
# R2 bucket: $R2_BACKUP_BUCKET_NAME (e.g. karmanprep-db-backups)
# Key:       backups/db/YYYY/MM/karmanprep-YYYY-MM-DD-HHMMSS.sql.gz
# Lifecycle: managed by R2 bucket lifecycle rule (set in CF dashboard;
#            recommended: keep 90 days, then auto-delete to control cost).
# ============================================================

name: Supabase backup

on:
  schedule:
    # 11:00 UTC = 04:00 PT (DST) / 03:00 PT (standard). Off-peak +
    # avoids the audit windows (09:00 + 13:00 UTC).
    - cron: "0 11 * * *"
  workflow_dispatch:
    # Manual trigger for ad-hoc backups (e.g. before a risky migration).

concurrency:
  group: supabase-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump → R2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres client (matching server version)
        # Supabase runs Postgres 15.x. Ubuntu 24.04 ships postgresql-
        # client-16 in its default repos, which is compatible
        # backward (pg_dump 16 can dump a 15 server). Pin to 16 for
        # deterministic behavior.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Run pg_dump
        id: dump
        env:
          # Supabase connection URL — use the SESSION-mode (port 5432)
          # connection string from the dashboard, NOT the pooler (port
          # 6543) which doesn't support pg_dump's transaction mode.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret not set. See PR description."
            exit 1
          fi
          STAMP=$(date -u +'%Y-%m-%d-%H%M%S')
          OUT="karmanprep-${STAMP}.sql"
          # --no-owner / --no-privileges drop the ownership + GRANT
          # statements that reference Supabase-specific roles. Restore
          # is then portable to any postgres without role setup.
          # --schema=public scopes to user-data (skips supabase
          # internal schemas like auth, storage which have their own
          # backup story).
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner \
            --no-privileges \
            --schema=public \
            --clean --if-exists \
            > "$OUT"
          gzip "$OUT"
          ls -lh "${OUT}.gz"
          echo "file=${OUT}.gz" >> $GITHUB_OUTPUT
          echo "stamp=${STAMP}" >> $GITHUB_OUTPUT
          # Compute size for the summary line; lets a downstream alert
          # check "backup was suspiciously small" later.
          SIZE=$(stat -c%s "${OUT}.gz")
          echo "size=${SIZE}" >> $GITHUB_OUTPUT

      - name: Upload to R2
        env:
          # R2 is S3-compatible. Use AWS CLI with the R2 endpoint.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET_NAME: ${{ secrets.R2_BACKUP_BUCKET_NAME }}
          AWS_DEFAULT_REGION: auto
          STAMP: ${{ steps.dump.outputs.stamp }}
          FILE: ${{ steps.dump.outputs.file }}
        run: |
          YEAR=$(echo "$STAMP" | cut -d'-' -f1)
          MONTH=$(echo "$STAMP" | cut -d'-' -f2)
          KEY="backups/db/${YEAR}/${MONTH}/${FILE}"
          aws s3 cp "$FILE" "s3://${R2_BACKUP_BUCKET_NAME}/${KEY}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo ""
          echo "✓ Backup uploaded: ${KEY} (${{ steps.dump.outputs.size }} bytes)"

      - name: Sanity check (size > 1 KB)
        env:
          SIZE: ${{ steps.dump.outputs.size }}
        run: |
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup is suspiciously small (${SIZE} bytes) — pg_dump likely failed silently."
            exit 1
          fi
          echo "Backup size: ${SIZE} bytes — OK."

      - name: Cleanup local file
        if: always()
        env:
          FILE: ${{ steps.dump.outputs.file }}
        run: rm -f "$FILE"
