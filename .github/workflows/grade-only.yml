# ============================================================
# grade-only — runs ONLY the multi-vote answer-key grader against
# the live database. No PDF extraction, no fill, no R2 reads.
# Use this when:
#   · A prior process-pdf run got cancelled mid-grading (the 60-min
#     Actions timeout on run #26324439132 was the trigger for this
#     workflow's existence).
#   · You want to re-grade the bank without re-running the whole
#     pipeline.
# ============================================================

name: Grade only

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max questions to grade in this run (default: all)"
        required: false
        type: string
        default: ""
      answer_source:
        description: "Filter to one answer_source (e.g. 'inferred' to spot-check AI-guessed)"
        required: false
        type: string
        default: ""
      import_status:
        description: "Filter to one import_status (e.g. 'needs_review' for flagged-only)"
        required: false
        type: string
        default: ""
      source_pdf:
        description: "Filter to questions from a single PDF (e.g. '202405us.pdf')"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GRADE_LIMIT: ${{ github.event.inputs.limit }}
      FILTER_ANSWER_SOURCE: ${{ github.event.inputs.answer_source }}
      FILTER_IMPORT_STATUS: ${{ github.event.inputs.import_status }}
      FILTER_SOURCE_PDF: ${{ github.event.inputs.source_pdf }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Pin npm to v11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run grader
        # multi-vote-grader.mjs reads LIMIT from env if set; otherwise
        # grades every question that hasn't been graded yet. Already-
        # graded questions are skipped automatically (idempotent).
        run: |
          if [ -n "$GRADE_LIMIT" ]; then
            LIMIT="$GRADE_LIMIT" node scripts/question-audit/multi-vote-grader.mjs --from-db
          else
            node scripts/question-audit/multi-vote-grader.mjs --from-db
          fi
