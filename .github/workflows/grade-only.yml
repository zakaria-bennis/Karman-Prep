# ============================================================
# grade-only — runs ONLY the typed answer-key verifier against
# the live database. No PDF extraction, no fill, no R2 reads.
#
# Use this when:
#   · A prior process-pdf run got cancelled mid-grading (the 60-min
#     Actions timeout on run #26324439132 was the trigger for this
#     workflow's existence).
#   · You want to re-grade the bank without re-running the whole
#     pipeline.
#
# Calls scripts/question-audit/verify-answers.mjs (the Phase 6
# typed-verifier panel: DeepSeek + Llama-via-OpenRouter +
# Gemini Flash → escalates to Pro / Opus / SymPy on disputes).
# This replaced multi-vote-grader.mjs in Phase 6; the old script
# was removed in the v2 phase 8.4 cleanup.
# ============================================================

name: Grade only

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max questions to grade in this run (default: all)"
        required: false
        type: string
        default: ""
      answer_source:
        description: "Filter to one answer_source (e.g. 'inferred' to spot-check AI-guessed)"
        required: false
        type: string
        default: ""
      import_status:
        description: "Filter to one import_status (e.g. 'needs_review' for flagged-only)"
        required: false
        type: string
        default: ""
      source_pdf:
        description: "Filter to questions from a single PDF (e.g. '202405us.pdf')"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GRADE_LIMIT: ${{ github.event.inputs.limit }}
      FILTER_ANSWER_SOURCE: ${{ github.event.inputs.answer_source }}
      FILTER_IMPORT_STATUS: ${{ github.event.inputs.import_status }}
      FILTER_SOURCE_PDF: ${{ github.event.inputs.source_pdf }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Pin npm to v11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run grader
        # verify-answers.mjs accepts --limit; otherwise grades every
        # eligible row. Already-verified questions are skipped
        # automatically via Phase 6's opt-in marker.
        run: |
          BASE_ARGS="--from-db"
          [ -n "$GRADE_LIMIT" ] && BASE_ARGS="$BASE_ARGS --limit $GRADE_LIMIT"
          [ -n "$FILTER_SOURCE_PDF" ] && BASE_ARGS="$BASE_ARGS --source-pdf $FILTER_SOURCE_PDF"
          node scripts/question-audit/verify-answers.mjs $BASE_ARGS
