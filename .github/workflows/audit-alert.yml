# ============================================================
# Audit alert — daily threshold check + Resend email.
#
# Runs every morning at 13:00 UTC (06:00 PT), AFTER the nightly
# audit ingest has finished updating question_findings. Uses
# audit-summary.mjs --json (shipped in #130) to snapshot the
# current quality state, compares against thresholds, and sends
# an email to the admin if anything crosses the line.
#
# Trigger thresholds (escalation ladder)
# ======================================
#   · blocking_open >= 5    → urgent email (subject: "🚨 …")
#   · blocking_open >= 1    → daily digest (subject: "Audit summary")
#   · 0 blocking + new_24h findings → quiet digest (informational)
#   · totally clean         → no email (silence is success)
#
# Recipient
# =========
# bennisz@outlook.com per the project's admin-email convention
# (see project_admin_email memory). Easy to add Slack later by
# adding a second step that posts to a webhook with the same
# JSON payload.
# ============================================================

name: Audit alert

on:
  schedule:
    # 13:00 UTC = 06:00 PT (DST) / 05:00 PT (standard). Runs ~4h
    # after the nightly audit so the data it reads is fresh.
    - cron: "0 13 * * *"
  workflow_dispatch:
    # Manual button for testing the alert path on demand.

concurrency:
  group: audit-alert-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alert:
    name: Check thresholds + send email
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Snapshot quality state
        id: snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/question-audit/audit-summary.mjs --json > /tmp/summary.json
          # Surface the four numbers the threshold logic needs.
          BLOCKING=$(jq -r '.totals.blocking_open' /tmp/summary.json)
          OPEN=$(jq -r '.totals.open' /tmp/summary.json)
          AFFECTED=$(jq -r '.totals.questions_affected' /tmp/summary.json)
          TOTAL=$(jq -r '.totals.questions_total' /tmp/summary.json)
          echo "blocking=$BLOCKING" >> $GITHUB_OUTPUT
          echo "open=$OPEN" >> $GITHUB_OUTPUT
          echo "affected=$AFFECTED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          # Cap the embedded JSON for the email body — full report is
          # uploaded as an artifact below.
          jq -c '{
            totals: .totals,
            top_codes: (.top_codes // [])[:5],
            by_source_pdf: (.by_source_pdf // [])[:5]
          }' /tmp/summary.json > /tmp/summary-trimmed.json

      - name: Decide whether to alert
        id: decide
        run: |
          BLOCKING=${{ steps.snapshot.outputs.blocking }}
          OPEN=${{ steps.snapshot.outputs.open }}
          # Three states: urgent / digest / silent.
          if [ "$BLOCKING" -ge 5 ]; then
            echo "tier=urgent" >> $GITHUB_OUTPUT
            echo "subject=🚨 Karman audit: $BLOCKING blocking findings open" >> $GITHUB_OUTPUT
          elif [ "$BLOCKING" -ge 1 ]; then
            echo "tier=digest" >> $GITHUB_OUTPUT
            echo "subject=Karman audit: $BLOCKING blocking · $OPEN open total" >> $GITHUB_OUTPUT
          elif [ "$OPEN" -gt 0 ]; then
            echo "tier=quiet" >> $GITHUB_OUTPUT
            echo "subject=Karman audit: $OPEN findings open (all NOTICE/WARNING)" >> $GITHUB_OUTPUT
          else
            echo "tier=silent" >> $GITHUB_OUTPUT
            echo "subject=" >> $GITHUB_OUTPUT
          fi

      - name: Send email via Resend
        if: steps.decide.outputs.tier != 'silent'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.AUDIT_ALERT_RECIPIENT }}
          SUBJECT: ${{ steps.decide.outputs.subject }}
          TIER: ${{ steps.decide.outputs.tier }}
          BLOCKING: ${{ steps.snapshot.outputs.blocking }}
          OPEN: ${{ steps.snapshot.outputs.open }}
          AFFECTED: ${{ steps.snapshot.outputs.affected }}
          TOTAL: ${{ steps.snapshot.outputs.total }}
        run: |
          # Build the email body — plain text, easy to read on phone.
          # Top-5 codes + top-5 source_pdfs come from the trimmed JSON
          # so we don't spam the inbox with the whole report.
          BODY=$(
            echo "Question-bank audit summary — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "TIER: $TIER"
            echo "BLOCKING (open) : $BLOCKING"
            echo "TOTAL open      : $OPEN"
            echo "Questions affected: $AFFECTED / $TOTAL"
            echo ""
            echo "Top 5 codes:"
            jq -r '.top_codes[] | "  \(.severity)  \(.code)  open=\(.open)"' /tmp/summary-trimmed.json
            echo ""
            echo "Top 5 source_pdfs by open count:"
            jq -r '.by_source_pdf[] | "  \(.source_pdf)  open=\(.open)  blocking=\(.blocking)"' /tmp/summary-trimmed.json
            echo ""
            echo "Open the dashboard for the full view + triage controls:"
            echo "  https://karmanprep.com/admin/questions/dashboard"
            echo ""
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          # Resend HTTP API — single curl, no SDK needed.
          # See https://resend.com/docs/api-reference/emails/send-email
          # The "from" address must be on a verified domain in Resend.
          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg from "$RESEND_FROM_EMAIL" \
              --arg to "$ADMIN_EMAIL" \
              --arg subject "$SUBJECT" \
              --arg text "$BODY" \
              '{from: $from, to: [$to], subject: $subject, text: $text}')" \
            | jq .
          echo ""
          echo "Alert dispatched (tier=$TIER)."

      - name: Log silent state
        if: steps.decide.outputs.tier == 'silent'
        run: |
          echo "✓ No open findings. Bank is clean — no email sent."

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-summary-${{ github.run_id }}
          path: /tmp/summary.json
          retention-days: 14
          if-no-files-found: warn
