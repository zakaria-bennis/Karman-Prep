#:schema node_modules/wrangler/config-schema.json
# ============================================================
# Karman Prep — Cloudflare Workers config (via OpenNext).
#
# Local dev:    npm run dev          (vanilla `next dev`)
# Build:        npm run cf:build     (OpenNext compiles to .open-next/)
# Preview:      npm run cf:preview   (runs the built worker locally)
# Deploy:       npm run cf:deploy    (uploads to CF Workers/Pages)
#
# Env vars are NOT defined here — set them in the Cloudflare
# dashboard (Pages/Workers → Settings → Variables and Secrets) so
# secrets aren't committed. Mirror the keys from .env.local:
#   NEXT_PUBLIC_APP_URL=https://karmanprep.com
#   NEXT_PUBLIC_SUPABASE_URL=...
#   NEXT_PUBLIC_SUPABASE_ANON_KEY=...
#   SUPABASE_SERVICE_ROLE_KEY=...
#   CLERK_SECRET_KEY=...
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=...
#   STRIPE_SECRET_KEY=...
#   STRIPE_WEBHOOK_SECRET=...
#   RESEND_API_KEY=...
#   RESEND_FROM_EMAIL=hello@karmanprep.com
#   CAL_API_KEY=...
#   CAL_WEBHOOK_SECRET=...
#   SLACK_BOT_TOKEN=...
#   SLACK_SIGNING_SECRET=...
#   OPENAI_API_KEY=...
#   GEMINI_API_KEY=...
#   R2_ACCOUNT_ID=...
#   R2_ACCESS_KEY_ID=...
#   R2_SECRET_ACCESS_KEY=...
#   R2_BUCKET_NAME=karmanprep-question-images
#   R2_PUBLIC_URL=https://images.karmanprep.com   # or pub-XXX.r2.dev
# ============================================================

name = "karmanprep"
main = ".open-next/worker.js"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

# Custom domains — CF auto-creates the DNS records since
# karmanprep.com is already in this account. SSL issues automatically.
routes = [
  { pattern = "karmanprep.com", custom_domain = true },
  { pattern = "www.karmanprep.com", custom_domain = true },
]

# Static assets bundled with the worker (Next.js public/ + build output).
# OpenNext writes these to .open-next/assets during build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ── Cron: nightly SAT-dates sync (migrated from vercel.json) ──
# Cloudflare crons run in UTC. "0 6 * * *" = 06:00 UTC = ~01:00 ET.
[triggers]
crons = ["0 6 * * *"]

# ── R2 binding for question-image storage ─────────────────────
# When code runs INSIDE the worker, you can use this binding
# directly (env.R2 in the request handler) for zero-auth uploads.
# Local dev / non-worker code uses the S3 SDK with R2 API tokens
# (see src/lib/storage/r2.ts and the R2_* env vars above).
[[r2_buckets]]
binding = "R2"
bucket_name = "karmanprep-question-images"
preview_bucket_name = "karmanprep-question-images-preview"

# ── Observability — basic CF logs ─────────────────────────────
[observability]
enabled = true
