<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page review</title>
    <style>
      :root {
        --ground: #15171a;
        --panel: #1c1f23;
        --raised: #262a30;
        --line: #333840;
        --ink: #eef0f2;
        --soft: #a9b0ba;
        --accent: #f0b65a;
        --approved: #6fcf97;
        --denied: #f2836b;
        --remove: #8d95a1;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        background: var(--ground);
        color: var(--ink);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      ::selection {
        background: var(--accent);
        color: #1a1408;
      }
      * {
        scrollbar-color: var(--line) transparent;
        scrollbar-width: thin;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--raised);
        border-radius: 8px;
        padding: 6px 11px;
        white-space: nowrap;
      }
      button:hover {
        border-color: var(--soft);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* The list of pages */
      #list {
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100vh;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      #list header {
        padding: 16px 16px 12px;
      }
      #list h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 650;
      }
      #tally {
        color: var(--soft);
        font-variant-numeric: tabular-nums;
      }
      #filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }
      #filters button {
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 13px;
      }
      #filters button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--ground);
        border-color: var(--ink);
      }
      #pages {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px 24px;
      }
      #pages h2 {
        margin: 18px 8px 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--soft);
      }
      .page {
        display: grid;
        grid-template-columns: 14px minmax(0, 1fr);
        gap: 8px;
        align-items: start;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 6px 8px;
        white-space: normal;
      }
      .page:hover {
        background: var(--raised);
      }
      .page[aria-current="true"] {
        background: var(--raised);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .page small {
        display: block;
        color: var(--soft);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .dot {
        width: 10px;
        height: 10px;
        margin-top: 5px;
        border-radius: 50%;
        border: 1.5px solid var(--soft);
      }
      .dot[data-status="approved"] {
        background: var(--approved);
        border-color: var(--approved);
      }
      .dot[data-status="denied"] {
        background: var(--denied);
        border-color: var(--denied);
      }
      .dot[data-status="remove"] {
        background: var(--remove);
        border-color: var(--remove);
        border-radius: 2px;
      }
      .dot[data-status="working"] {
        background: var(--accent);
        border-color: var(--accent);
      }
      .page[data-status="remove"] b {
        text-decoration: line-through;
        color: var(--soft);
      }
      .page b {
        font-weight: 500;
      }

      /* The page being reviewed */
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: 100vh;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      #menu {
        display: none;
      }
      #title {
        font-weight: 650;
        font-size: 15px;
        margin-right: 4px;
      }
      #address {
        flex: 1 1 140px;
        min-width: 100px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        color: var(--soft);
      }
      #address:focus {
        color: var(--ink);
      }
      .set {
        display: flex;
      }
      .set button {
        border-radius: 0;
        margin-left: -1px;
      }
      .set button:first-child {
        border-radius: 8px 0 0 8px;
        margin-left: 0;
      }
      .set button:last-child {
        border-radius: 0 8px 8px 0;
      }
      .set button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--ground);
        border-color: var(--ink);
        position: relative;
      }
      #verdict button[data-status="approved"][aria-pressed="true"] {
        background: var(--approved);
        border-color: var(--approved);
        color: #0d2416;
      }
      #verdict button[data-status="denied"][aria-pressed="true"] {
        background: var(--denied);
        border-color: var(--denied);
        color: #2b0f08;
      }
      #verdict button[data-status="remove"][aria-pressed="true"] {
        background: var(--remove);
        border-color: var(--remove);
        color: #14171a;
      }
      #stage {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
        background: #0c0d0f;
      }
      #frame {
        position: absolute;
        top: 0;
        border: 0;
        background: #fff;
        transform-origin: top left;
      }
      #empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 6px;
        padding: 24px;
        text-align: center;
        color: var(--soft);
      }

      /* Direction */
      #dock {
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 10px 12px 12px;
      }
      #thread {
        max-height: 30vh;
        overflow-y: auto;
        margin: 0 0 10px;
        padding: 0;
        list-style: none;
      }
      #thread li {
        padding: 5px 0;
        display: grid;
        grid-template-columns: 62px minmax(0, 1fr);
        gap: 10px;
      }
      #thread li span {
        color: var(--soft);
        font-size: 12px;
        padding-top: 2px;
      }
      #thread li[data-from="claude"] p {
        color: var(--accent);
      }
      #thread p {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #latest {
        display: flex;
        gap: 10px;
        align-items: baseline;
        margin-bottom: 8px;
        color: var(--soft);
        min-height: 20px;
      }
      #latest p {
        margin: 0;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #latest[data-tone="claude"] p {
        color: var(--accent);
      }
      #latest[data-tone="warn"] p {
        color: var(--denied);
      }
      #latest button {
        padding: 1px 8px;
        font-size: 12px;
      }
      #send {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      #direction {
        flex: 1;
        min-height: 42px;
        max-height: 30vh;
        resize: none;
        background: var(--ground);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        field-sizing: content;
      }
      #direction::placeholder {
        color: #8b929c;
      }
      #send button {
        background: var(--accent);
        border-color: var(--accent);
        color: #1a1408;
        font-weight: 600;
        padding: 10px 16px;
      }

      @media (max-width: 900px) {
        body {
          grid-template-columns: minmax(0, 1fr);
        }
        #menu {
          display: block;
        }
        #bar {
          gap: 6px;
          padding: 8px;
        }
        #bar button {
          padding: 5px 9px;
          font-size: 13px;
        }
        #title {
          display: none;
        }
        #list {
          position: fixed;
          z-index: 5;
          inset: 0 auto 0 0;
          width: min(320px, 88vw);
          transform: translateX(-100%);
          transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
          box-shadow: 12px 0 40px rgb(0 0 0 / 0.5);
        }
        body.open #list {
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #list {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <nav id="list" aria-label="Pages">
      <header>
        <h1>Pages</h1>
        <div id="tally"></div>
        <div id="filters"></div>
      </header>
      <div id="pages"></div>
    </nav>

    <main>
      <div id="bar">
        <button id="menu" type="button">Pages</button>
        <span id="title">Pick a page</span>
        <input id="address" aria-label="Address of this page" spellcheck="false" />
        <div class="set" id="sizes" role="group" aria-label="Screen size"></div>
        <button id="reload" type="button">Reload</button>
        <div class="set" id="verdict" role="group" aria-label="Your verdict"></div>
        <button id="next" type="button">Next page</button>
      </div>

      <div id="stage">
        <iframe id="frame" title="The page being reviewed" hidden></iframe>
        <div id="empty">Pick a page from the list.</div>
      </div>

      <div id="dock">
        <ul id="thread" hidden></ul>
        <div id="latest">
          <p></p>
          <button id="history" type="button" hidden>History</button>
        </div>
        <form id="send">
          <textarea
            id="direction"
            rows="1"
            aria-label="Your direction for this page"
            placeholder="Say what to change on this page, or type the new words."
          ></textarea>
          <button type="submit">Send</button>
        </form>
      </div>
    </main>

    <script>
      // Phone is an iPhone 17 Pro Max (440 by 956 points); Tablet is an iPad Air upright
      const SIZES = { Desktop: 1440, Tablet: 820, Phone: 440 };
      const HEIGHTS = { Tablet: 1180, Phone: 956 };
      const VERDICTS = { approved: "Approve", denied: "Deny", remove: "Remove" };
      const FILTERS = {
        all: "All",
        none: "To review",
        approved: "Approved",
        denied: "Denied",
        remove: "Remove",
        tools: "Building tools",
      };
      const $ = (id) => document.getElementById(id);
      const remembered = (key, fallback) => {
        try {
          return localStorage.getItem(key) ?? fallback;
        } catch {
          return fallback;
        }
      };
      const remember = (key, value) => {
        try {
          localStorage.setItem(key, value);
        } catch {
          /* private window: nothing to keep */
        }
      };

      let data = { pages: [], records: {}, busy: null, waiting: [], listening: false, site: "" };
      let current = decodeURIComponent(location.hash.slice(1)) || remembered("review-page", "");
      let size = remembered("review-size", "Desktop");
      let filter = "all";
      let shown = "";
      let seen = "";

      // Pages only the builders see are kept out of the count and the list, under their own filter.
      const TOOLS = "Building tools";
      // ?only=Student portal narrows the whole board to one part of the site
      const ONLY = new URLSearchParams(location.search).get("only");
      const facing = () =>
        data.pages.filter((page) => (ONLY ? page.group === ONLY : page.group !== TOOLS));
      const statusOf = (route) => data.records[route]?.status ?? "none";
      const isWorking = (route) => data.busy?.route === route || data.waiting.includes(route);
      const pageOf = (route) => data.pages.find((page) => page.route === route);
      const addressOf = (page) => data.records[page.route]?.address ?? page.address;

      async function post(url, body) {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!response.ok) throw new Error((await response.json()).error ?? "That did not save.");
        await refresh();
      }

      async function refresh() {
        const text = await (await fetch("/api/state")).text();
        if (text === seen) return;
        data = JSON.parse((seen = text));
        draw();
      }

      function make(tag, props = {}, children = []) {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children);
        return node;
      }

      function drawList() {
        const count = (status) => facing().filter((page) => statusOf(page.route) === status).length;
        $("tally").textContent =
          `${facing().length} pages. ${count("approved")} approved, ${count("denied")} denied, ` +
          `${count("remove")} to remove, ${count("none")} to review.`;

        $("filters").replaceChildren(
          ...Object.entries(FILTERS).map(([key, label]) => {
            const button = make("button", { type: "button", textContent: label });
            button.setAttribute("aria-pressed", String(filter === key));
            button.onclick = () => {
              filter = key;
              draw();
            };
            return button;
          })
        );

        const visible =
          filter === "tools"
            ? data.pages.filter((page) => page.group === TOOLS)
            : facing().filter((page) => filter === "all" || statusOf(page.route) === filter);
        const nodes = [];
        let group = "";
        for (const page of visible) {
          if (page.group !== group) nodes.push(make("h2", { textContent: (group = page.group) }));
          const status = isWorking(page.route) ? "working" : statusOf(page.route);
          const dot = make("i", { className: "dot" });
          dot.dataset.status = status;
          const row = make("button", { type: "button", className: "page" }, [
            dot,
            make("span", {}, [
              make("b", { textContent: page.name }),
              make("small", { textContent: page.route }),
            ]),
          ]);
          row.dataset.status = statusOf(page.route);
          row.setAttribute("aria-current", String(page.route === current));
          row.onclick = () => open(page.route);
          nodes.push(row);
        }
        if (!visible.length) nodes.push(make("h2", { textContent: "No pages here yet." }));
        $("pages").replaceChildren(...nodes);
      }

      function drawBar() {
        const page = pageOf(current);
        $("title").textContent = page ? page.name : "Pick a page";
        document.title = page ? `${page.name}: page review` : "Page review";
        if (document.activeElement !== $("address"))
          $("address").value = page ? addressOf(page) : "";
        $("address").disabled = !page;

        $("sizes").replaceChildren(
          ...Object.keys(SIZES).map((label) => {
            const button = make("button", { type: "button", textContent: label });
            button.setAttribute("aria-pressed", String(size === label));
            button.onclick = () => {
              size = label;
              remember("review-size", size);
              draw();
            };
            return button;
          })
        );

        $("verdict").replaceChildren(
          ...Object.entries(VERDICTS).map(([status, label]) => {
            const active = page && statusOf(current) === status;
            const button = make("button", { type: "button", textContent: label, disabled: !page });
            button.dataset.status = status;
            button.setAttribute("aria-pressed", String(Boolean(active)));
            button.onclick = () =>
              post("/api/page", { route: current, status: active ? "none" : status });
            return button;
          })
        );
        $("reload").disabled = $("next").disabled = !page;
      }

      function fit() {
        const stage = $("stage");
        const frame = $("frame");
        const width = size === "Desktop" ? Math.max(stage.clientWidth, 1280) : SIZES[size];
        const tall = HEIGHTS[size];
        // a phone or tablet is drawn whole, at its real proportions, as large as the space allows
        const room = 24;
        const scale = tall
          ? Math.min(1, stage.clientWidth / width, (stage.clientHeight - room) / tall)
          : Math.min(1, stage.clientWidth / width);
        frame.style.width = `${width}px`;
        frame.style.height = `${tall ?? stage.clientHeight / scale}px`;
        frame.style.transform = `scale(${scale})`;
        frame.style.left = `${Math.max(0, (stage.clientWidth - width * scale) / 2)}px`;
        frame.style.top = tall ? `${Math.max(0, (stage.clientHeight - tall * scale) / 2)}px` : "0";
        frame.style.borderRadius = size === "Phone" ? "56px" : tall ? "24px" : "0";
        frame.style.boxShadow = tall ? "0 0 0 10px #000, 0 0 0 11px #3a3a44" : "none";
      }

      function drawFrame() {
        const page = pageOf(current);
        const frame = $("frame");
        frame.hidden = !page;
        $("empty").hidden = Boolean(page);
        if (!page) return;
        const url = data.site + addressOf(page);
        if (url !== shown) frame.src = shown = url;
        $("empty").hidden = !page.needsAddress || Boolean(data.records[page.route]?.address);
        if (!$("empty").hidden) {
          frame.hidden = true;
          $("empty").textContent =
            "This page needs a real example to open, such as one student or one skill. " +
            "Paste its address in the box above and press Enter.";
        }
        fit();
      }

      function drawDock() {
        const page = pageOf(current);
        const history = (data.records[current]?.history ?? []).filter(
          (entry) => entry.from !== "status"
        );
        const last = history[history.length - 1];
        const latest = $("latest");
        const line = latest.querySelector("p");
        latest.dataset.tone = "";
        if (!page) line.textContent = "";
        else if (isWorking(current) && !data.listening) {
          latest.dataset.tone = "warn";
          line.textContent =
            "Claude is not listening. Tell Claude in the chat to check the review board.";
        } else if (isWorking(current)) line.textContent = "Claude is working on it.";
        else if (last?.from === "claude") {
          latest.dataset.tone = "claude";
          line.textContent = last.text;
        } else line.textContent = "";
        line.title = line.textContent;

        $("history").hidden = history.length === 0;
        $("thread").replaceChildren(
          ...history.map((entry) => {
            const row = make("li", {}, [
              make("span", { textContent: entry.from === "claude" ? "Claude" : "You" }),
              make("p", { textContent: entry.text }),
            ]);
            row.dataset.from = entry.from;
            return row;
          })
        );
        if (!history.length) $("thread").hidden = true;
        $("direction").disabled = $("send").querySelector("button").disabled = !page;
      }

      function draw() {
        drawList();
        drawBar();
        drawFrame();
        drawDock();
      }

      function open(route) {
        current = route;
        remember("review-page", route);
        history.replaceState(null, "", "#" + encodeURIComponent(route));
        document.body.classList.remove("open");
        $("thread").hidden = true;
        draw();
      }

      $("menu").onclick = () => document.body.classList.toggle("open");
      $("stage").onclick = () => document.body.classList.remove("open");
      $("reload").onclick = () => {
        $("frame").src = shown;
      };
      $("history").onclick = () => {
        $("thread").hidden = !$("thread").hidden;
        $("thread").scrollTop = $("thread").scrollHeight;
      };
      $("next").onclick = () => {
        const pages = facing();
        const at = pages.findIndex((page) => page.route === current);
        const rest = [...pages.slice(at + 1), ...pages.slice(0, at)];
        const next = rest.find((page) => statusOf(page.route) === "none") ?? rest[0];
        if (next) open(next.route);
      };
      $("address").onkeydown = (event) => {
        if (event.key !== "Enter" || !current) return;
        const value = $("address").value.trim();
        $("address").blur();
        if (value.startsWith("/")) post("/api/page", { route: current, address: value });
      };
      $("send").onsubmit = async (event) => {
        event.preventDefault();
        const text = $("direction").value.trim();
        if (!text || !current) return;
        $("direction").value = "";
        try {
          await post("/api/direction", {
            route: current,
            address: addressOf(pageOf(current)),
            size,
            text,
          });
        } catch (error) {
          $("direction").value = text;
          $("latest").dataset.tone = "warn";
          $("latest").querySelector("p").textContent = error.message;
        }
      };
      $("direction").onkeydown = (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          $("send").requestSubmit();
        }
      };
      addEventListener("hashchange", () => {
        const route = decodeURIComponent(location.hash.slice(1));
        if (route !== current && pageOf(route)) open(route);
      });
      new ResizeObserver(fit).observe($("stage"));
      refresh();
      setInterval(() => refresh().catch(() => {}), 1500);
    </script>
  </body>
</html>
