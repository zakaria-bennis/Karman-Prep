<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calculator v2 shell harness</title>
    <style>
      body {
        margin: 0;
      }
      #frame {
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100dvh;
      }
      #calc {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;

    <button id="outside" type="button">Outside</button>
    <div id="frame" tabindex="-1">
      <div id="slot" data-calculator-title-slot></div>
      <div id="calc"></div>
    </div>
    <script type="module" src="./calculator.tsx"></script>
  </body>
</html>
