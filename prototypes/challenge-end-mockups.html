<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challenge results</title>
<style>
:root{--ink:#f4f1ff;--dim:#cfcae8;--line:rgba(255,255,255,.2);--pick:#5b94ff;--correct:#8fe0b0;--wrong:#ff9d8c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 12%,#3a3f86 0,#1b1f4d 35%,#0b0d26 75%);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:24px 16px;display:grid;place-items:start center}
.panel{position:relative;width:min(100%,520px);background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:26px;padding:22px 20px 20px;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center}
.x:hover{background:rgba(255,255,255,.16)}
.q{padding:6px 0 18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.acts button{font:inherit;font-weight:800;font-size:17px;border-radius:16px;padding:14px;cursor:pointer}
.leave{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink)}
.review{background:var(--correct);border:0;color:#0b0d26;box-shadow:0 0 18px -4px var(--correct)}
.q + .q{border-top:1px solid var(--line);padding-top:18px}
.head{display:flex;gap:10px;align-items:center;margin-bottom:14px;padding-right:44px}
.head b{font-size:18px}
.res{font-weight:800;font-size:14px;border-radius:99px;padding:2px 12px;color:#0b0d26}.res.ok{background:var(--correct);box-shadow:0 0 14px 0 var(--correct)}.res.no{background:var(--wrong);box-shadow:0 0 14px 0 var(--wrong)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.num .v{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.num small{color:var(--dim);font-size:14px}
.num .v{display:inline-block;padding:4px 0}
.num .v.fast{color:var(--correct)}
.num .v.slow{color:var(--wrong)}
.num small{display:block;margin-top:4px}
.picks{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:24px 1fr 46px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.pick .bar{height:14px;border-radius:9px;background:rgba(255,255,255,.1);position:relative}
.pick .bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:rgba(255,255,255,.45);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.pick.right .bar i{background:var(--correct);box-shadow:0 0 14px 0 var(--correct)}
.pick.mine .bar{outline:2px solid var(--pick);outline-offset:2px}
.pick span{text-align:right}
.q{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.q:nth-of-type(2){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.gone{opacity:0;transform:scale(.97);transition:.25s;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="panel" id="panel" role="dialog" aria-label="Challenge results">
 <button class="x" aria-label="Close" onclick="shut()">✕</button>

 <div class="q"><div class="head"><b>Reading and Writing</b><span class="res ok">Correct</span></div>
  <div class="nums">
   <div class="num"><div class="v"><span data-to="62">0</span>%</div><small>got it right</small></div>
   <div class="num"><div class="v fast">0:48</div><small>average 1:10</small></div>
  </div>
  <div class="picks">
   <div class="pick right mine"><b>A</b><div class="bar"><i data-w="62"></i></div><span>62%</span></div>
   <div class="pick"><b>B</b><div class="bar"><i data-w="21"></i></div><span>21%</span></div>
   <div class="pick"><b>C</b><div class="bar"><i data-w="12"></i></div><span>12%</span></div>
   <div class="pick"><b>D</b><div class="bar"><i data-w="5"></i></div><span>5%</span></div>
  </div>
 </div>

 <div class="q"><div class="head"><b>Math</b><span class="res no">Incorrect</span></div>
  <div class="nums">
   <div class="num"><div class="v"><span data-to="31">0</span>%</div><small>got it right</small></div>
   <div class="num"><div class="v slow">2:05</div><small>average 1:30</small></div>
  </div>
  <div class="picks">
   <div class="pick right"><b>A</b><div class="bar"><i data-w="31"></i></div><span>31%</span></div>
   <div class="pick mine"><b>B</b><div class="bar"><i data-w="44"></i></div><span>44%</span></div>
   <div class="pick"><b>C</b><div class="bar"><i data-w="17"></i></div><span>17%</span></div>
   <div class="pick"><b>D</b><div class="bar"><i data-w="8"></i></div><span>8%</span></div>
  </div>
 </div>
 <div class="acts"><button class="leave" onclick="shut()">Leave</button><button class="review">Review</button></div>
</div>
<script>
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function count(el,to,ms){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('[data-w]').forEach((i,n)=>setTimeout(()=>i.style.width=i.dataset.w+'%',still?0:350+n*80))));
document.querySelectorAll('[data-to]').forEach(el=>still?el.textContent=el.dataset.to:count(el,+el.dataset.to,1200));
function shut(){document.getElementById('panel').classList.add('gone')}
addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
</script>
</body></html>
