<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Portal Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;800&family=Young+Serif&family=Zen+Antique&display=swap" rel="stylesheet">
<style>
:root{--canvas:rgb(16 19 25);--surface:rgb(27 32 41);--tint:rgb(31 52 84);--block:rgb(50 58 71);--line:rgb(45 52 64);--ink:rgb(238 242 250);--mute:rgb(183 195 212);--accent:rgb(136 193 255);--accent-ink:rgb(14 32 54);--gold:rgb(220 192 137);--math:rgb(121 201 255);--reading:rgb(255 160 183);--pos:rgb(78 201 138);--neg:rgb(255 140 130);--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{--canvas:rgb(241 241 238);--surface:rgb(250 249 245);--tint:rgb(214 232 226);--block:rgb(222 224 215);--line:rgb(225 227 218);--ink:rgb(21 32 46);--mute:rgb(77 92 80);--accent:rgb(39 113 101);--accent-ink:rgb(248 246 239);--gold:rgb(120 90 37);--math:rgb(40 91 121);--reading:rgb(150 61 99);--pos:rgb(28 112 70);--neg:rgb(170 50 50)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/22px "Hanken Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden}
a{color:inherit}
button,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:30px;line-height:36px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;line-height:24px;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;z-index:9;background:var(--surface);padding:10px}

/* Review bar: for the founder, not part of the product */
.review{display:flex;flex-wrap:wrap;gap:0 14px;align-items:center;padding:4px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}
#asWrap[hidden]{display:none}
.review label{display:flex;gap:6px;align-items:center;min-height:44px}
.review select{min-height:36px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 8px;color:var(--ink)}
.review button{min-height:44px;background:none;border:0;padding:0 2px;cursor:pointer;color:var(--ink)}

/* App frame */
.app{display:block;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.app.focus{padding-bottom:24px}
main{width:100%;max-width:1120px;margin:auto;padding:20px 16px 32px}
.nav{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--mute);font-size:12px;line-height:16px;border-radius:12px;}
.nav a[aria-current=page]{color:var(--ink);font-weight:600}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .brand{display:none}
.focus .nav{display:none}

/* Header and stat strip */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.me-top{flex:none;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:var(--block);color:inherit;display:block;overflow:hidden;cursor:pointer}
.me-top[aria-expanded=true]{outline:2px solid var(--ink);outline-offset:2px}
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:16px;font-weight:600}
.strip a{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none}
.strip .gold{color:var(--gold)}
.strip small{font-size:14px;font-weight:500;color:var(--mute)}

/* Blocks */
.stack{display:grid;gap:16px;min-width:0}
.cols{display:grid;gap:16px}
.card{background:var(--surface);border-radius:20px;padding:20px;min-width:0}
.card>h2{margin-bottom:12px}
.hero{padding:22px;background:var(--tint)}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero h2{font-size:28px;line-height:32px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px}
.state{color:var(--mute)}
.hero .state{color:var(--ink)}
.hero svg.fox{flex:none;margin:-6px -4px 0 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px;background:var(--surface);border-radius:20px;padding:14px 12px}
.day{display:grid;justify-items:center;gap:6px;font-size:13px;line-height:16px;color:var(--mute)}
.day i{width:30px;height:30px;border-radius:50%;background:var(--block);display:grid;place-items:center}
.day.done i{background:var(--pos)}
.day.done i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--surface)}
.day.today{color:var(--ink);font-weight:600}.day.today i{background:none;outline:2px solid var(--ink);outline-offset:-2px}
.segs{display:flex;gap:4px;margin:18px 0}
.segs i{flex:1;height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.segs i.ok{background:var(--pos)}.segs i.no{background:var(--neg)}
.segs i.now{outline:2px solid var(--ink);outline-offset:1px}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:0 20px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer}
.link{display:inline-flex;align-items:center;min-height:44px;background:none;border:0;padding:0;text-decoration:none;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none}
.card>h2+.row,.card>h2+.law+.row{border-top:0}
.row>b{font-weight:500;min-width:0;display:flex;align-items:center;gap:12px}
.row>span{color:var(--mute);font-size:14px;text-align:right;flex:0 1 auto}
.tile{flex:none;width:36px;height:36px;border-radius:10px;background:var(--block);display:grid;place-items:center}
.tile svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.num{font-size:64px;line-height:64px;font-weight:800;letter-spacing:-.03em}
.score{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.score p{color:var(--mute);font-size:14px}
.score strong{display:block;font-size:24px;line-height:30px;font-weight:600;color:var(--ink)}
.meter{height:10px;border-radius:5px;background:var(--block);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter.g i{background:var(--gold)}.meter.math i{background:var(--math)}.meter.rw i{background:var(--reading)}
.note{margin-top:8px;color:var(--mute);font-size:14px}
.skill{display:block;padding:12px 0;border-top:1px solid var(--line);text-decoration:none}
.card>h2+.skill,.card>h2+.law+.skill{border-top:0}
.skill div:first-child{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-weight:500}
.skill div:first-child span{color:var(--mute);font-weight:400}
.bands{display:flex;gap:3px;height:14px;margin-bottom:6px}.bands i{border-radius:4px}
.chart{width:100%;height:auto;display:block;margin-top:14px}
.chart text{fill:var(--mute);font:500 13px "Hanken Grotesk",sans-serif}
.chart .val{fill:var(--ink);font-weight:600;font-size:15px;opacity:0;transition:opacity .15s}
.chart .pt.shown .val,.chart .pt:hover .val,.chart .pt:focus .val{opacity:1}
.chart .pt{outline:0}.chart .pt:focus-visible .mk{outline:2px solid var(--ink);outline-offset:3px}
.chart .hit{fill:transparent}
.chart .mk{fill:var(--accent);stroke:var(--canvas);stroke-width:2}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.chart .wash{fill:color-mix(in srgb,var(--accent) 12%,transparent)}
.chart .floor{stroke:var(--line)}
details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:17px}
.lock{color:var(--mute);margin-bottom:4px}
.gold{color:var(--gold)}
.foxrow{display:flex;align-items:center;gap:16px}
.boxart{display:grid;place-items:center;padding:12px 0}
.law{display:none;margin:8px 0;padding:8px 10px;border:1px dashed var(--gold);border-radius:8px;color:var(--gold);font-size:14px;line-height:20px;font-weight:400}
.laws .law{display:block}

/* Question */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{min-height:44px;padding:0 12px;background:none;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.tool[aria-pressed=true]{background:var(--block)}
.q{max-width:720px;margin:auto;display:grid;gap:14px}
.qtext{font-size:19px;line-height:28px}
.qtext.hl{background:color-mix(in srgb,var(--gold) 22%,transparent);border-radius:6px}
.skillname{color:var(--mute);font-size:14px;margin-bottom:8px}
.pad{width:100%;min-height:110px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical;font:inherit}
.ans{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;padding:8px 14px;background:var(--surface);border:2px solid var(--line);border-radius:14px;cursor:pointer;text-align:left}
.ans[aria-checked=true]{border-color:var(--ink)}
.ans.ok{border-color:var(--pos)}.ans.no{border-color:var(--neg)}
.ans strong{flex:none;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--mute);border-radius:50%;font-weight:500;font-size:14px}
.err{font-weight:500}
.fb b{display:block}
.endnums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
.endnums strong{display:block;font-size:30px;line-height:36px;font-weight:800}
.endnums p{color:var(--mute);font-size:14px}

/* iPad and up: rail replaces tabs */
@media (min-width:768px){
 .app{display:grid;grid-template-columns:76px minmax(0,1fr);padding-bottom:0;align-items:start}
 .app.focus{display:block}
 main{padding:28px 32px 48px}
 .nav{position:sticky;top:0;right:auto;bottom:auto;height:100vh;flex-direction:column;gap:6px;border-top:0;border-right:1px solid var(--line);padding:16px 8px}
 .nav a{flex:none;min-height:60px}
 .nav .brand{display:flex}
 .nav .brand{font-weight:800;font-size:15px;color:var(--ink);margin-bottom:12px;min-height:44px}
 .week{max-width:560px}
}
/* Mouse and keyboard: the rail floats over the page as a blurred extension of it */
@media (min-width:768px) and (hover:hover) and (pointer:fine){
 .app{display:block}
 .nav{position:fixed;left:10px;top:10px;bottom:10px;height:auto;width:84px;padding:12px 8px;z-index:6;border:0;border-radius:24px;transform:translate3d(-120%,0,0);visibility:hidden;background:linear-gradient(160deg,rgb(255 255 255 / .2),rgb(255 255 255 / .05) 38%,rgb(255 255 255 / .11)),color-mix(in srgb,var(--canvas) 34%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.6);backdrop-filter:blur(12px) saturate(1.6);box-shadow:inset 0 1px 0 rgb(255 255 255 / .55),inset 1px 0 0 rgb(255 255 255 / .16),inset -1px -1px 0 rgb(255 255 255 / .1),0 18px 44px rgb(0 0 0 / .4)}
 .nav.lensed{-webkit-backdrop-filter:url(#lens);backdrop-filter:url(#lens)}
 .rail-zone{position:fixed;left:0;top:0;bottom:0;width:14px;z-index:5}
 .app::before{content:"";position:fixed;left:4px;top:50%;width:4px;height:52px;margin-top:-26px;border-radius:2px;background:var(--ink);opacity:.3;z-index:4;pointer-events:none}
 .app.focus::before{display:none}
}
@media (min-width:1100px){.cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}.num{font-size:72px;line-height:72px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Motion: everything tappable is tactile. The easing curves come from motion.js */
html{interpolate-size:allow-keywords}
.cta,.row,.skill,.tool,.ans,.chip,.nav a,.strip a,.link,.btn,.slot,.dayc,.me-top{transition:transform var(--bounce-ms,500ms) var(--bounce,cubic-bezier(.2,.8,.2,1)),background-color .18s,border-color .18s,color .18s,box-shadow var(--bounce-ms,500ms) var(--bounce,ease);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.cta,.btn,.tool,.ans,.chip,.slot,.dayc{transition-property:transform,background-color,border-color,color,box-shadow}
.cta{--lip:color-mix(in srgb,var(--accent) 62%,#000);box-shadow:0 5px 0 var(--lip),inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent);margin-bottom:5px}
.cta.pressed,.cta:active{transform:translateY(4px) scale(.985);box-shadow:0 1px 0 var(--lip),inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent);transition-duration:60ms;transition-timing-function:ease-out}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;background:var(--block);color:var(--ink);border:0;border-radius:13px;font-weight:600;text-decoration:none;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--block) 62%,#000);margin-bottom:3px}
.btn.pressed,.btn:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 color-mix(in srgb,var(--block) 62%,#000);transition-duration:60ms;transition-timing-function:ease-out}
.btn[disabled],.cta[disabled]{opacity:.55;cursor:not-allowed}
.row.pressed,.skill.pressed,.ans.pressed,.chip.pressed,.slot.pressed,.dayc.pressed{transform:scale(.965);transition-duration:60ms;transition-timing-function:ease-out}
.tool.pressed,.link.pressed,.strip a.pressed,.me-top.pressed{transform:scale(.92);transition-duration:60ms;transition-timing-function:ease-out}
@media (hover:hover){.cta:hover{transform:translateY(-1px)}.btn:hover{transform:translateY(-1px)}a.row:hover,button.row:hover,.skill:hover{transform:translateX(3px)}.nav a:hover{color:var(--ink)}}
.fox{transform-origin:50% 85%;cursor:pointer}
.meter i{transform-origin:left center}
.nav{isolation:isolate}
.nav a{position:relative;z-index:1}
.nav a[aria-current=page]{background:none}
.nav a.pressed{transform:scale(.88);transition-duration:60ms}
.pill{position:absolute;left:0;top:0;z-index:0;border-radius:12px;background:var(--block);pointer-events:none}
.badge{position:absolute;top:0;left:calc(50% + 11px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--neg);color:#14171d;font-size:11px;line-height:16px;font-weight:600;text-align:center}
:root[data-theme=light] .badge{color:#fff}
.block{position:fixed;z-index:30;width:12px;height:12px;border-radius:3px;pointer-events:none}
details::details-content{block-size:0;overflow:hidden;transition:block-size .42s var(--pop,ease),content-visibility .42s allow-discrete}
details[open]::details-content{block-size:auto}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgb(5 7 12 / .62);opacity:0;display:none}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:90dvh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:24px 24px 0 0;padding:0 20px calc(24px + env(safe-area-inset-bottom));display:none;outline:0;will-change:transform}
.scrim.on,.sheet.on{display:block}
.grab{position:sticky;top:0;z-index:2;display:grid;place-items:center;height:30px;margin:0 -20px;background:var(--surface);touch-action:none;cursor:grab}
.grab i{width:44px;height:5px;border-radius:3px;background:var(--mute);opacity:.6}
.sheet-body{display:grid;gap:12px}
.sheet h2{font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.015em}
.sheet .meta{color:var(--mute)}
.sheet .cta{margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.noteb{background:var(--block);border-radius:12px;padding:12px 14px}
.rulebox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--mute);font-size:14px;line-height:20px}
.cost{font-weight:600}.cost.free{color:var(--pos)}.cost.pay{color:var(--gold)}
@media (min-width:768px){.grab{display:none}.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,92vw);max-height:86dvh;border-radius:24px;padding:24px;transform:translate(-50%,-50%)}}

/* Homework */
.group{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.group small{font-size:14px;color:var(--mute);font-weight:400}
.group.late h2{color:var(--neg)}
.row.btnrow{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.card>.group+.row{border-top:0}
.row .t2{display:block;font-size:14px;line-height:18px;color:var(--mute);font-weight:400}
.row .late{color:var(--neg)}
.tile.good{background:var(--pos);color:#102016}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:none;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.field{display:grid;gap:6px}.field>span{font-weight:500}
.field select,.field textarea{min-height:44px;background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:8px 12px;width:100%;color:var(--ink);font:inherit}
.sug{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.card>h2+.sug,.card>h2+.law+.sug{border-top:0}
.sug b{font-weight:600}.sug p{color:var(--mute);font-size:14px;line-height:20px}

/* Schedule */
.dayg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dayc{display:grid;justify-items:center;align-content:center;gap:1px;min-height:52px;padding:4px 0;background:none;border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:16px;color:inherit;cursor:pointer}
.dayc b{font-size:16px;font-weight:600}
.dayc[disabled]{opacity:.4;cursor:not-allowed}
.dayc[aria-checked=true]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.dayc.has{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.dayc.plain{cursor:default}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.slot{min-height:48px;background:none;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:500}
.slot[disabled]{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.slot[aria-checked=true]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.bigcredit{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.tag{display:inline-block;font-size:13px;line-height:18px;padding:0 8px;border-radius:9px;background:var(--block);color:var(--ink);font-weight:500;margin-top:3px}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--ink);color:var(--canvas);padding:12px 18px;border-radius:16px;font-weight:600;display:none}
.toast.on{display:block}
@media (min-width:768px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){.pressed{transform:none!important}details::details-content{transition:none}}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="review" aria-label="Review controls">
  <strong>Demo: Maya, simulated</strong>
  <label>Look <select id="style"></select></label>
  <label>Plan <select id="plan"></select></label>
  <label id="asWrap">View as <select id="viewAs"><option value="student">Maya, student</option><option value="tutor">David, tutor</option></select></label>
  <button id="lawsBtn" type="button">Show the laws</button>
  <button id="themeBtn" type="button">Switch theme</button>
  <button id="resetBtn" type="button">Start over</button>
</div>
<div class="app" id="app">
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter><filter id="rough-fine" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".14" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></svg>
<script src="fox.js"></script>
<script src="demo-student.js"></script>
<script src="motion.js"></script>
<script src="app.js"></script>
<script src="styles.js"></script>
<script src="skills.js"></script>
<script src="school.js"></script>
<script src="account.js"></script>
<script src="world.js"></script>
</body>
</html>
