<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17 -156 250 250" class="klogo katmosphere" role="img" aria-label="Karman Prep"><style>
.katmosphere .ink{fill:var(--logo-ink,var(--d-ink))}.katmosphere .acc{fill:var(--logo-acc,var(--d-acc))}
.katmosphere .ink-s{fill:none;stroke:var(--logo-ink,var(--d-ink))}.katmosphere .acc-s{fill:none;stroke:var(--logo-acc,var(--d-acc))}
.katmosphere{--d-ink:#1d1a22;--d-acc:#2449b8}
@media (prefers-color-scheme:dark){.katmosphere{--d-ink:#fffaf3;--d-acc:#e7cf9a}}
.katmosphere .w,.katmosphere .ln{stroke-dasharray:1 2;stroke-dashoffset:1.01;animation:k-draw linear forwards}
.katmosphere .ln.ease{animation-timing-function:cubic-bezier(.45,0,.2,1)}
.katmosphere .fx{opacity:0;transform-box:fill-box;transform-origin:center;animation:k-fade .6s cubic-bezier(.2,.8,.2,1) forwards}
.katmosphere .fx.rise{animation-name:k-rise}.katmosphere .fx.pop{animation-name:k-pop;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
.katmosphere .tw{transform-box:fill-box;transform-origin:center;animation:k-tw 2.6s ease-in-out infinite}
.katmosphere .orb-still{display:none}
@keyframes k-draw{to{stroke-dashoffset:0}}
@keyframes k-fade{to{opacity:1}}
@keyframes k-rise{from{opacity:0;transform:translateY(30%)}to{opacity:1;transform:none}}
@keyframes k-pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@keyframes k-tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.55) rotate(45deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){.katmosphere .w,.katmosphere .ln{animation:none;stroke-dashoffset:0}
.katmosphere .fx{animation:none;opacity:1;transform:none}.katmosphere .tw{animation:none}.katmosphere .orb{display:none}.katmosphere .orb-still{display:inline}}
