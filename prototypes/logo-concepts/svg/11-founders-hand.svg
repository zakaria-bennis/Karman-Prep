<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 110 880 210" class="klogo kfoundershand" role="img" aria-label="Karman Prep"><style>
.kfoundershand .ink{fill:var(--logo-ink,var(--d-ink))}.kfoundershand .acc{fill:var(--logo-acc,var(--d-acc))}
.kfoundershand .ink-s{fill:none;stroke:var(--logo-ink,var(--d-ink))}.kfoundershand .acc-s{fill:none;stroke:var(--logo-acc,var(--d-acc))}
.kfoundershand{--d-ink:#1d1a22;--d-acc:#2449b8}
@media (prefers-color-scheme:dark){.kfoundershand{--d-ink:#fffaf3;--d-acc:#e7cf9a}}
.kfoundershand .w,.kfoundershand .ln{stroke-dasharray:1 2;stroke-dashoffset:1.01;animation:k-draw linear forwards}
.kfoundershand .ln.ease{animation-timing-function:cubic-bezier(.45,0,.2,1)}
.kfoundershand .fx{opacity:0;transform-box:fill-box;transform-origin:center;animation:k-fade .6s cubic-bezier(.2,.8,.2,1) forwards}
.kfoundershand .fx.rise{animation-name:k-rise}.kfoundershand .fx.pop{animation-name:k-pop;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
.kfoundershand .tw{transform-box:fill-box;transform-origin:center;animation:k-tw 2.6s ease-in-out infinite}
.kfoundershand .orb-still{display:none}
@keyframes k-draw{to{stroke-dashoffset:0}}
@keyframes k-fade{to{opacity:1}}
@keyframes k-rise{from{opacity:0;transform:translateY(30%)}to{opacity:1;transform:none}}
@keyframes k-pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@keyframes k-tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.55) rotate(45deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){.kfoundershand .w,.kfoundershand .ln{animation:none;stroke-dashoffset:0}
.kfoundershand .fx{animation:none;opacity:1;transform:none}.kfoundershand .tw{animation:none}.kfoundershand .orb{display:none}.kfoundershand .orb-still{display:inline}}
